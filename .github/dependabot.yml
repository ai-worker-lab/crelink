# 의존성 갱신 PR을 주 1회 엽니다. CI가 통과하는 PR을 main에 병합하면 Deploy가 운영에 반영합니다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # 운영 이미지 베이스(apps/api·apps/web Dockerfile)
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: weekly
  # 운영 스택 compose의 caddy·alpine 이미지(infra/prod/compose.yaml)
  - package-ecosystem: docker-compose
    directory: /infra/prod
    schedule:
      interval: weekly
