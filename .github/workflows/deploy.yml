# main의 CI가 성공하면 운영(prod)에 배포합니다: API(OCI, GHCR 이미지 + SSH) → 웹(Vercel CLI) → 운영 주소 검사.
# 배포 직후 검사가 실패하면 그 영역을 자동 롤백합니다. 수동 롤백은 rollback.yml.
# 기준: docs/specs/crelink-prod-deploy.md, 런북 infra/docs/prod-runbook.md, 결정 docs/adr/0010-prod-deployment-topology.md
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 변경 영역과 관계없이 API·웹을 모두 배포
        type: boolean
        default: false

permissions:
  contents: read

# 배포는 한 번에 하나씩, 진행 중인 배포를 취소하지 않습니다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  API_IMAGE_REPO: ghcr.io/ai-worker-lab/crelink-api
  WEB_URL: https://links.shaul.kr
  SHORT_URL: https://go.shaul.kr

jobs:
  plan:
    name: plan
    # workflow_run은 CI가 성공한 main push에서만, 수동 실행은 main에서만 배포합니다.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      api_ready: ${{ steps.secrets.outputs.api_ready }}
      web_ready: ${{ steps.secrets.outputs.web_ready }}
    steps:
      - name: 배포 대상 커밋
        id: target
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=${RUN_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
      # 영역별로 마지막 성공 배포 커밋(태그 deploy/prod-api, deploy/prod-web)과 비교해 바뀐 영역만 배포합니다.
      # 태그가 없으면(최초) 그 영역을 배포합니다. 시크릿이 없어 건너뛴 실행은 태그를 옮기지 않으므로 변경이 누락되지 않습니다.
      - name: 변경 영역
        id: changes
        env:
          FORCE: ${{ inputs.force }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          decide() {
            local area=$1 pattern=$2 base
            base=$(git rev-parse -q --verify "refs/tags/deploy/prod-$area^{commit}" || true)
            if [[ "$FORCE" == "true" || -z "$base" ]]; then echo "$area: 배포(force 또는 첫 배포)"; echo "$area=true" >> "$GITHUB_OUTPUT"; return; fi
            if git diff --name-only "$base" "$SHA" | grep -Eq "$pattern"; then
              echo "$area: 배포(${base:0:7} 이후 변경)"; echo "$area=true" >> "$GITHUB_OUTPUT"
            else
              echo "$area: 변경 없음(${base:0:7})"; echo "$area=false" >> "$GITHUB_OUTPUT"
            fi
          }
          decide api '^(apps/api/|packages/shared/|infra/prod/|pnpm-lock\.yaml$|\.dockerignore$)'
          decide web '^(apps/web/|packages/shared/|packages/design-tokens/|pnpm-lock\.yaml$)'
      # 운영 시크릿이 아직 없으면(최초 준비 전) 배포 job을 건너뜁니다. 값은 출력하지 않습니다.
      - name: 시크릿 준비 여부
        id: secrets
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          [[ -n "$OCI_HOST" && -n "$OCI_SSH_KEY" ]] && echo "api_ready=true" >> "$GITHUB_OUTPUT" || echo "::warning::OCI 시크릿이 없어 API 배포를 건너뜁니다(infra/docs/prod-runbook.md)."
          [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_PROJECT_ID" ]] && echo "web_ready=true" >> "$GITHUB_OUTPUT" || echo "::warning::Vercel 시크릿이 없어 웹 배포를 건너뜁니다(infra/docs/prod-runbook.md)."

  api-image:
    name: API 이미지
    needs: plan
    if: needs.plan.outputs.api == 'true' && needs.plan.outputs.api_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # 런타임 단계에 RUN이 있으면 arm64 에뮬레이션이 필요합니다. 빌드 단계는 러너 플랫폼에서 돕니다(apps/api/Dockerfile).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.API_IMAGE_REPO }}:${{ needs.plan.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy-api:
    name: API 배포
    needs: [plan, api-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # 성공한 배포 커밋을 태그 deploy/prod-api로 기록
      packages: read # 서버가 GHCR 이미지를 받을 때 이 job의 GITHUB_TOKEN을 일회용으로 넘김(서버에 장기 토큰 없음)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: SSH 준비
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      # 서버 스크립트를 이 커밋의 것으로 맞춘 뒤 실행합니다(compose·Caddyfile 변경도 함께 반영).
      - name: 서버 설정 동기화
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        # edge/(서버 공용 Caddy, /opt/edge)는 런북 절차로만 바꾸므로 동기화하지 않습니다. 크리링 사이트 파일은 deploy.sh가 /opt/edge/sites로 반영합니다.
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            --exclude '.env' --exclude 'releases.log' --exclude '*.example' --exclude 'README.md' --exclude 'edge/' --exclude 'tests/' \
            infra/prod/ "$OCI_USER@$OCI_HOST:/opt/crelink/"
      - name: deploy.sh
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          GHCR_PULL_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        # deploy.sh는 헬스체크 실패 시 서버에서 이전 이미지로 스스로 되돌리고 1로 끝납니다. 토큰은 stdin으로만 넘깁니다.
        run: |
          printf '%s\n' "$GHCR_PULL_TOKEN" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$OCI_USER@$OCI_HOST" \
            "cd /opt/crelink && GHCR_PULL_USER='$GHCR_PULL_USER' GHCR_PULL_TOKEN_STDIN=1 ./deploy.sh '$SHA'"
      - name: 배포 기록 태그
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git tag -f deploy/prod-api "$SHA"
          git push -f origin refs/tags/deploy/prod-api

  deploy-web:
    name: 웹 배포
    needs: [plan, deploy-api]
    # API 배포가 실패하면 웹을 배포하지 않습니다. API 배포를 건너뛴 경우에는 진행합니다.
    if: >-
      always() && needs.plan.result == 'success'
      && needs.plan.outputs.web == 'true' && needs.plan.outputs.web_ready == 'true'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # 성공한 배포 커밋을 태그 deploy/prod-web로 기록
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: vercel build·deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm dlx vercel@62 pull --yes --environment=production --token "$VERCEL_TOKEN"
          pnpm dlx vercel@62 build --prod --token "$VERCEL_TOKEN"
          pnpm dlx vercel@62 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: 운영 웹 검사
        run: |
          for _ in $(seq 30); do
            if curl -fsS -o /dev/null "$WEB_URL/" && curl -fsS -o /dev/null "$WEB_URL/privacy"; then echo "웹 정상"; exit 0; fi
            sleep 5
          done
          echo "::error::운영 웹 검사 실패"; exit 1
      # 새 배포가 운영으로 승격된 뒤 검사가 실패했을 때만 직전 운영 배포로 되돌립니다(Vercel Instant Rollback).
      - name: 실패 시 웹 롤백
        if: failure() && steps.deploy.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@62 rollback --token "$VERCEL_TOKEN" --yes
      - name: 배포 기록 태그
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git tag -f deploy/prod-web "$SHA"
          git push -f origin refs/tags/deploy/prod-web

  verify-prod:
    name: 운영 주소 검사
    needs: [plan, deploy-api, deploy-web]
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.deploy-api.result == 'success' || needs.deploy-web.result == 'success')
      && needs.deploy-api.result != 'failure' && needs.deploy-web.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: smoke
        run: |
          set -u
          fail=0
          check() { local name=$1 expect=$2 got=$3; if [[ "$got" == "$expect" ]]; then echo "ok   $name ($got)"; else echo "FAIL $name: 기대 $expect, 실제 $got"; fail=1; fi; }
          check "웹 /" 200 "$(curl -s -o /dev/null -w '%{http_code}' "$WEB_URL/")"
          check "웹 BFF health" 200 "$(curl -s -o /dev/null -w '%{http_code}' "$WEB_URL/api/backend/api/health")"
          check "단축 없는 주소 302" 302 "$(curl -s -o /dev/null -w '%{http_code}' "$SHORT_URL/zzz-e2e-none")"
          check "단축 → notice" "$WEB_URL/notice?reason=link_not_found" "$(curl -s -o /dev/null -w '%{redirect_url}' "$SHORT_URL/zzz-e2e-none")"
          check "API 직접 접근 차단" 404 "$(curl -s -o /dev/null -w '%{http_code}' "$SHORT_URL/api/health")"
          exit $fail
