# main의 CI가 성공하면 운영(prod)에 배포합니다: 이미지(API·웹, GHCR :<SHA>) → 배포 대상마다 Tailscale+SSH로 릴리스 배포 → 운영 주소 검사.
# 배포 대상은 infra/prod/targets.json(enabled), 서버 쪽은 deploy 사용자의 forced command(infra/prod/ssh-entry.sh)만 실행됩니다.
# 서버 deploy.sh는 새 릴리스를 비활성 색에 올려 헬스를 통과할 때만 트래픽을 넘깁니다(Blue/Green 무중단, ADR 0011). 새 색이 헬스에 실패하면
# 그 색만 내리고 활성 색·트래픽은 그대로 둔 채 배포 실패(종료 1)입니다. 운영 주소 검사(서버의 verify.sh가 Cloudflare를 거쳐 공개 주소 호출)가
# 실패하면 같은 job이 그 대상을 직전 릴리스로 롤백(같은 무중단 전환)하고 실패로 끝납니다. 수동 롤백은 rollback.yml.
# 운영 주소 검사를 러너에서 하지 않는 이유: Cloudflare가 GitHub 러너(데이터센터 IP)의 요청을 403으로 막습니다(2026-10-07 확인).
# CI에는 앱 비밀값이 없습니다(서버가 infra/prod/secrets/<대상>.sops.env를 복호화). 이 워크플로가 쓰는 값:
#   vars.TS_OIDC_CLIENT_ID·vars.TS_OIDC_AUDIENCE  Tailscale workload identity federation(main 브랜치 job만 허용, tag:ci)
#   secrets.DEPLOY_SSH_KEY                         서버 deploy 사용자 SSH 개인키(forced command로 배포 명령만 가능)
#   vars.SENTRY_ORG·vars.SENTRY_PROJECT_API·vars.SENTRY_PROJECT_WEB  Sentry 조직·프로젝트 slug(소스맵 업로드 대상, 공개 값)
#   vars.SENTRY_WEB_DSN                            웹 Sentry DSN(이벤트 전송만 허용하는 공개 값, 웹 이미지 빌드 시점에 번들에 들어감)
#   secrets.SENTRY_AUTH_TOKEN                      Sentry 조직 토큰(org:ci, 소스맵 업로드·릴리스 생성 전용). 앱 비밀값이 아니고 앱은 쓰지 않습니다.
#                                                  environment 보호가 없는 Free 조직이라 push 권한자가 워크플로를 고쳐 읽을 수 있습니다(ADR 0012).
#   비어 있으면 소스맵 업로드를 건너뛰고 웹 이미지는 Sentry가 꺼진 채 만들어집니다. API DSN은 서버 암호문의 SENTRY_DSN입니다.
# 기준: docs/specs/crelink-prod-deploy.md, 런북 infra/docs/prod-runbook.md, 결정 docs/adr/0010-prod-deployment-topology.md·0012-error-monitoring-sentry.md
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 변경 영역과 관계없이 API·웹 이미지를 새로 만들어 배포
        type: boolean
        default: false

permissions:
  contents: read

# 배포는 한 번에 하나씩, 진행 중인 배포를 취소하지 않습니다(rollback.yml과 같은 그룹).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/ai-worker-lab/crelink

jobs:
  plan:
    name: plan
    # workflow_run은 CI가 성공한 main push에서만, 수동 실행은 main에서만 배포합니다.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      api_image: ${{ steps.changes.outputs.api_image }}
      web_image: ${{ steps.changes.outputs.web_image }}
      release: ${{ steps.changes.outputs.release }}
      targets: ${{ steps.targets.outputs.targets }}
      platforms: ${{ steps.targets.outputs.platforms }}
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - name: 배포 대상 커밋
        id: target
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=${RUN_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
      # 마지막 성공 배포 커밋(태그 deploy/prod-api·deploy/prod-web·deploy/prod)과 비교해 바뀐 것만 만듭니다.
      # 태그가 없으면(최초) 그 영역을 만듭니다. 배포를 건너뛴 실행은 태그를 옮기지 않으므로 변경이 누락되지 않습니다.
      - name: 변경 영역
        id: changes
        env:
          FORCE: ${{ inputs.force }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          # 영역마다 <key>=true|false와 <key>_image(배포할 이미지 SHA: 새로 만들면 이 커밋, 아니면 마지막 성공 배포 태그의 커밋)를 냅니다.
          # 이미지를 "-"(서버의 지금 이미지)로 넘기지 않습니다. 롤백 뒤 서버의 지금 이미지는 옛 이미지라 새 설정과 어긋날 수 있기 때문입니다.
          decide() {
            local key=$1 tag=$2 pattern=$3 base
            base=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
            if [[ "$FORCE" == "true" || -z "$base" ]]; then
              echo "$key: 예(force 또는 첫 배포)"; echo "$key=true" >> "$GITHUB_OUTPUT"; echo "${key}_image=$SHA" >> "$GITHUB_OUTPUT"; return
            fi
            if git diff --name-only "$base" "$SHA" | grep -Eq "$pattern"; then
              echo "$key: 예(${base:0:7} 이후 변경)"; echo "$key=true" >> "$GITHUB_OUTPUT"; echo "${key}_image=$SHA" >> "$GITHUB_OUTPUT"
            else
              echo "$key: 아니오(${base:0:7})"; echo "$key=false" >> "$GITHUB_OUTPUT"; echo "${key}_image=$base" >> "$GITHUB_OUTPUT"
            fi
          }
          decide api deploy/prod-api '^(apps/api/|packages/shared/|pnpm-lock\.yaml$|\.dockerignore$)'
          decide web deploy/prod-web '^(apps/web/|packages/shared/|packages/design-tokens/|pnpm-lock\.yaml$|\.dockerignore$)'
          # 릴리스(설정·비밀값 포함)는 이미지가 바뀌었거나 infra/prod가 바뀌면 배포합니다.
          decide release deploy/prod '^(apps/api/|apps/web/|packages/shared/|packages/design-tokens/|pnpm-lock\.yaml$|\.dockerignore$|infra/prod/)'
      - name: 배포 대상
        id: targets
        run: |
          targets=$(jq -c '[.targets[] | select(.enabled) | {name, host, platform}]' infra/prod/targets.json)
          platforms=$(jq -r '[.targets[] | select(.enabled) | .platform] | unique | join(",")' infra/prod/targets.json)
          [[ "$targets" != "[]" ]] || { echo "::error::infra/prod/targets.json에 enabled 대상이 없습니다."; exit 1; }
          echo "대상: $targets / 플랫폼: $platforms"
          { echo "targets=$targets"; echo "platforms=$platforms"; } >> "$GITHUB_OUTPUT"
      # 접속 설정이 아직 없으면(최초 준비 전) 이미지까지만 만들고 배포는 건너뜁니다. 값은 출력하지 않습니다.
      - name: 접속 설정 여부
        id: ready
        env:
          TS_OIDC_CLIENT_ID: ${{ vars.TS_OIDC_CLIENT_ID }}
          TS_OIDC_AUDIENCE: ${{ vars.TS_OIDC_AUDIENCE }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [[ -n "$TS_OIDC_CLIENT_ID" && -n "$TS_OIDC_AUDIENCE" && -n "$DEPLOY_SSH_KEY" ]]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Tailscale(vars.TS_OIDC_*)·DEPLOY_SSH_KEY 설정이 없어 배포를 건너뜁니다(infra/docs/prod-runbook.md \"CI 접속 설정\")."; fi

  image:
    name: 이미지 ${{ matrix.area }}
    needs: plan
    strategy:
      matrix:
        area: [api, web]
    # 바뀐 영역만 만듭니다(matrix 값으로 plan 출력을 고름).
    if: needs.plan.outputs.api == 'true' || needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: 이 영역을 만들지
        id: want
        env:
          WANT: ${{ matrix.area == 'api' && needs.plan.outputs.api || needs.plan.outputs.web }}
        run: echo "build=$WANT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.want.outputs.build == 'true'
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # 대상에 arm64가 있을 때만 QEMU가 필요합니다(API는 빌드 단계를 러너 플랫폼에서 교차 빌드, 웹은 대상 플랫폼에서 빌드).
      - uses: docker/setup-qemu-action@v4
        if: steps.want.outputs.build == 'true' && contains(needs.plan.outputs.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v4
        if: steps.want.outputs.build == 'true'
      - uses: docker/login-action@v4
        if: steps.want.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Sentry(ADR 0012): release는 배포 커밋 SHA. 웹만 DSN을 빌드 시점에 넣습니다(API DSN은 서버 SOPS 암호문의 SENTRY_DSN).
      # 소스맵은 SENTRY_AUTH_TOKEN이 있을 때만 올립니다. vars·secret이 비어 있으면 빈 값이 넘어가 업로드를 건너뛰고(빈 secret은 action이
      # "is not a valid secret" 경고만 내고 넘기지 않음) 웹은 Sentry가 꺼진 이미지가 됩니다. 토큰이 있는데 업로드가 실패하면 이 job이 실패합니다.
      # secret은 BuildKit 캐시 키에 들어가지 않아 같은 커밋을 토큰 없이 만든 층이 재사용될 수 있으므로 토큰 유무를 SENTRY_UPLOAD로 넘깁니다.
      - uses: docker/build-push-action@v7
        if: steps.want.outputs.build == 'true'
        with:
          context: .
          file: apps/${{ matrix.area }}/Dockerfile
          platforms: ${{ needs.plan.outputs.platforms }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.area }}:${{ needs.plan.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.area }}
          cache-to: type=gha,mode=max,scope=${{ matrix.area }}
          build-args: |
            SENTRY_RELEASE=${{ needs.plan.outputs.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ matrix.area == 'api' && vars.SENTRY_PROJECT_API || '' }}${{ matrix.area == 'web' && vars.SENTRY_PROJECT_WEB || '' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ matrix.area == 'web' && vars.SENTRY_WEB_DSN || '' }}
            SENTRY_UPLOAD=${{ secrets.SENTRY_AUTH_TOKEN != '' && 'yes' || 'no' }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    name: 배포 ${{ matrix.target.name }}
    needs: [plan, image]
    if: >-
      always() && needs.plan.result == 'success'
      && needs.plan.outputs.release == 'true' && needs.plan.outputs.ready == 'true'
      && (needs.image.result == 'success' || needs.image.result == 'skipped')
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # 서버가 GHCR 이미지를 받을 때 이 job의 GITHUB_TOKEN을 일회용으로 넘김(서버에 장기 토큰 없음)
      id-token: write # Tailscale workload identity federation
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:ci
          ping: ${{ matrix.target.host }}
      - name: SSH 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        # 호스트 신원은 Tailscale(WireGuard 키)이 보증하므로 처음 보는 호스트 키를 받아들입니다(실행마다 새 known_hosts).
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n' > ~/.ssh/config
      # stdin: 첫 줄 GHCR 사용자·토큰, 이어서 이 커밋의 infra/prod 묶음(시험·문서 제외). 서버 ssh-entry.sh가 releases/<SHA>로 풉니다.
      - name: deploy
        env:
          HOST: ${{ matrix.target.host }}
          SHA: ${{ needs.plan.outputs.sha }}
          API: ${{ needs.plan.outputs.api_image }}
          WEB: ${{ needs.plan.outputs.web_image }}
          GHCR_PULL_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2029 # 명령 인자는 러너에서 펼쳐 보냅니다(서버 forced command가 형식을 다시 검사).
          { printf '%s %s\n' "$GHCR_PULL_USER" "$GHCR_PULL_TOKEN"
            tar -czf - -C infra/prod --exclude ./tests --exclude ./README.md --exclude '*.example' --exclude ./.env .
          } | ssh "deploy@$HOST" "deploy $SHA $API $WEB"
      - name: 운영 주소 검사
        id: verify
        env:
          HOST: ${{ matrix.target.host }}
        run: ssh "deploy@$HOST" verify
      # 배포는 성공했는데 운영 주소 검사가 실패했을 때만 직전 릴리스로 되돌립니다(배포 자체가 실패하면 서버가 트래픽을 넘기지 않아 되돌릴 것이 없음).
      - name: 자동 롤백
        if: failure() && steps.verify.outcome == 'failure'
        env:
          HOST: ${{ matrix.target.host }}
          GHCR_PULL_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ github.token }}
        run: |
          printf '%s %s\n' "$GHCR_PULL_USER" "$GHCR_PULL_TOKEN" | ssh "deploy@$HOST" rollback
          ssh "deploy@$HOST" verify || echo "::warning::롤백 뒤에도 운영 주소 검사가 실패합니다. 런북 \"장애 대응\"을 보세요."
          echo "::error::운영 주소 검사가 실패해 $HOST 를 직전 릴리스로 되돌렸습니다."

  # 모든 대상 배포와 운영 주소 검사가 성공했을 때만 배포 기록 태그를 옮깁니다(다음 실행의 변경 비교 기준).
  record:
    name: 배포 기록 태그
    needs: [plan, deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: 태그
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          API: ${{ needs.plan.outputs.api }}
          WEB: ${{ needs.plan.outputs.web }}
        run: |
          tags=(deploy/prod)
          [[ "$API" == true ]] && tags+=(deploy/prod-api)
          [[ "$WEB" == true ]] && tags+=(deploy/prod-web)
          for t in "${tags[@]}"; do git tag -f "$t" "$SHA"; git push -f origin "refs/tags/$t"; done
