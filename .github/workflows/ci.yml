# PR마다 자동으로 돌지 않습니다. 평소 검사는 이 기기의 `pnpm ci:local --report`가 맡고(0237, ADR 0016 결정 5), 이 workflow는 로컬에서 못 도는
# E2E·WebKit·Firefox·amd64 이미지가 필요할 때 손으로 실행합니다: gh workflow run CI --ref <브랜치>. 기준: docs/development/verification.md#ci
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 기준 런타임은 Node 24 LTS(.nvmrc·운영 이미지 node:24-slim)이고, 26은 다음 LTS 후보(짝수 major)라 다음 기준
        # 전환 준비로 함께 시험합니다. 22(Maintenance LTS)는 뺍니다: NestJS 12가 ESM 전용이라 CommonJS API와 API Jest가
        # Node 24.9 이상에서만 돕니다(NestJS 마이그레이션 가이드). 지원 범위는 README 요구사항과 같이 고칩니다.
        node: [24, 26]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crelink
          POSTGRES_USER: crelink
          POSTGRES_PASSWORD: crelink-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crelink -d crelink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://crelink:crelink-ci-only@127.0.0.1:5432/crelink
    steps:
      - uses: actions/checkout@v7
      # pnpm 버전은 package.json의 packageManager를 읽습니다.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 로컬과 같은 단계(scripts/verify.mjs)를 실행합니다. 실패해도 남은 단계 결과까지 보고합니다.
      - run: pnpm verify --keep-going

  smoke:
    name: smoke
    # 시각 baseline은 이 OS와 lockfile의 Playwright 버전에서만 생성·비교합니다.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crelink
          POSTGRES_USER: crelink
          POSTGRES_PASSWORD: crelink-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crelink -d crelink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crelink:crelink-ci-only@127.0.0.1:5432/crelink
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 포트·주소는 이 checkout 인스턴스(슬롯 0, 원본 infra/local/.env.example) 값을 다음 단계 환경으로 넘깁니다.
      - name: 인스턴스 포트
        run: node scripts/instance.mjs --print-env | grep -E '^(API_PORT|WEB_PORT|API_URL|WEB_URL|SHORT_LINK_BASE_URL)=' >> "$GITHUB_ENV"
      - run: pnpm --filter @crelink/shared build
      - run: pnpm --filter @crelink/api build
      - run: pnpm --filter @crelink/web build
      - name: API·웹 시작
        env:
          DATABASE_URL: postgresql://crelink:crelink-ci-only@127.0.0.1:5432/crelink
        run: |
          mkdir -p .local/ci
          WEB_URL="$WEB_URL" API_URL="$API_URL" SHORT_LINK_BASE_URL="$SHORT_LINK_BASE_URL" DATABASE_URL="$DATABASE_URL" CRELINK_E2E_INSTABIO=1 NODE_OPTIONS="--import $GITHUB_WORKSPACE/tests/e2e/instabio-source.mjs" PORT="$API_PORT" nohup node apps/api/dist/main.js > .local/ci/api.log 2>&1 &
          API_INTERNAL_URL="$API_URL" nohup pnpm --filter @crelink/web exec next start --port "$WEB_PORT" > .local/ci/web.log 2>&1 &
      - name: 서비스 준비 대기
        run: |
          for _ in $(seq 60); do
            if curl -fsS "$API_URL/api/health/ready" > /dev/null && curl -fsS "$WEB_URL" > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "API·웹이 2분 안에 준비되지 않았습니다. 아래 'API·웹 로그' 단계를 확인하세요."
          exit 1
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: pnpm smoke
      # 같은 DB의 전역 상태·지표 대조군이 겹치지 않도록 suite를 순서대로 실행합니다.
      # 테스트 인증은 로컬 fixture이며 실제 Google OAuth/실물 기기 시험이 아닙니다.
      - name: 핵심 사용자 E2E
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/.local/ci/e2e/core/report
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/.local/ci/e2e/core/results.json
        run: pnpm e2e '(^|/)(creator|visitor|operator|notices|guestbook|instabio-import)\.spec\.ts$' --project=main --reporter=list,html,json --output=.local/ci/e2e/core/results
      - name: 가상 사용자 권한·세션 E2E
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/.local/ci/e2e/personas/report
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/.local/ci/e2e/personas/results.json
        run: pnpm e2e personas --project=personas --no-deps --reporter=list,html,json --output=.local/ci/e2e/personas/results
      - name: 분석 반응형 3엔진 E2E
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/.local/ci/e2e/analytics/report
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/.local/ci/e2e/analytics/results.json
        run: pnpm e2e --config tests/e2e/analytics-responsive.config.ts --reporter=list,html,json --output=.local/ci/e2e/analytics/results
      - name: 링크 배치 3엔진 E2E
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/.local/ci/e2e/layout/report
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/.local/ci/e2e/layout/results.json
        run: pnpm e2e --config tests/e2e/link-layout.config.ts --reporter=list,html,json --output=.local/ci/e2e/layout/results
      - name: 브라우저 검증 증거
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .local/ci/e2e/
            .local/ci/*.log
            .local/smoke/test-results/
      - name: API·웹 로그
        if: failure()
        run: |
          echo '::group::API 로그'; cat .local/ci/api.log || true; echo '::endgroup::'
          echo '::group::웹 로그'; cat .local/ci/web.log || true; echo '::endgroup::'

  # 운영 이미지(API·웹)가 빌드되는지 확인합니다. 푸시하지 않습니다. 배포·멀티 플랫폼 빌드는 deploy.yml(infra/prod/targets.json의 플랫폼).
  image:
    name: 이미지 빌드 ${{ matrix.area }}
    strategy:
      matrix:
        area: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.area }}/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.area }}
          cache-to: type=gha,mode=max,scope=${{ matrix.area }}

  # 수동 실행의 전체 결과를 필수 검사와 같은 이름으로 남깁니다. 평소에는 `pnpm ci:local --report`가 같은 이름의 commit status를 기록합니다.
  ci-ok:
    name: CI 통과
    if: always()
    needs: [check, smoke, image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: job 결과 확인
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job 결과: $RESULTS"
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            echo "실패하거나 취소된 job이 있습니다. 위 job 로그를 확인하세요."
            exit 1
          fi
