# 운영(prod) 수동 롤백. 배포 대상 서버의 rollback.sh로 이전 릴리스(설정·비밀값·API·웹 이미지 전체)로 되돌립니다.
# 배포와 같은 무중단 전환입니다: 그 릴리스를 비활성 색에 올려 헬스를 통과할 때만 트래픽을 넘기고, 실패하면 활성 색·트래픽은 그대로 둔 채
# 롤백 실패(종료 1)입니다. blue/green 이전 형식 릴리스로는 롤백하지 않습니다(런북 "14-5. 되돌리기").
# 릴리스 SHA를 비우면 지금 릴리스 직전 운영 릴리스, 지정하면 그 릴리스(서버에 남은 최근 릴리스만 가능).
# 접속은 deploy.yml과 같습니다(Tailscale workload identity + deploy 사용자 forced command). main에서만 실행할 수 있습니다.
# 기준: docs/specs/crelink-prod-deploy.md, infra/docs/prod-runbook.md
name: Rollback

on:
  workflow_dispatch:
    inputs:
      target:
        description: 배포 대상 이름(infra/prod/targets.json의 name)
        type: string
        default: home-server
      release:
        description: 되돌릴 릴리스(커밋 SHA). 비우면 직전 운영 릴리스
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  rollback:
    name: 롤백 ${{ inputs.target }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # 이미지가 서버에 없을 때 받도록 이 job의 GITHUB_TOKEN을 일회용으로 넘김
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: 입력 확인
        id: input
        env:
          TARGET: ${{ inputs.target }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [[ -n "$RELEASE" && ! "$RELEASE" =~ ^[0-9a-f]{7,40}$ ]]; then echo "::error::release는 커밋 SHA여야 합니다."; exit 1; fi
          host=$(jq -r --arg t "$TARGET" '.targets[] | select(.name == $t) | .host' infra/prod/targets.json)
          [[ -n "$host" ]] || { echo "::error::infra/prod/targets.json에 대상 $TARGET 이 없습니다."; exit 1; }
          echo "host=$host" >> "$GITHUB_OUTPUT"
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:ci
          ping: ${{ steps.input.outputs.host }}
      - name: rollback
        env:
          HOST: ${{ steps.input.outputs.host }}
          RELEASE: ${{ inputs.release }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_PULL_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ github.token }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n' > ~/.ssh/config
          # shellcheck disable=SC2029 # 인자는 러너에서 펼쳐 보냅니다(서버 forced command가 형식을 다시 검사).
          printf '%s %s\n' "$GHCR_PULL_USER" "$GHCR_PULL_TOKEN" | ssh "deploy@$HOST" "rollback $RELEASE"
      # 서버의 verify.sh가 Cloudflare를 거쳐 공개 주소를 부릅니다(러너 IP는 Cloudflare가 403으로 막음).
      - name: 운영 주소 검사
        env:
          HOST: ${{ steps.input.outputs.host }}
        run: ssh "deploy@$HOST" verify
