function visibleLinks(){return state.data.links.filter(x=>!x.hidden&&!x.blocked)}
function dirty(){const profile=state.data.creator.name!==state.saved.creator.name||state.data.creator.bio!==state.saved.creator.bio||state.data.creator.photo!==state.saved.creator.photo;const socials=JSON.stringify(state.data.socials)!==JSON.stringify(state.saved.socials);const forms=Object.values(state.drafts).some(d=>JSON.stringify(d.value)!==JSON.stringify(d.initial));return profile||socials||forms}
function dirtyKind(kind){return Object.values(state.drafts).some(d=>d.kind===kind&&JSON.stringify(d.value)!==JSON.stringify(d.initial))||(kind==='link'?JSON.stringify(state.data.links)!==JSON.stringify(state.saved.links):JSON.stringify(state.data.portfolio)!==JSON.stringify(state.saved.portfolio))}
function nav(){const make=mobile=>items.map(([key,label])=>`<button data-menu="${key}" aria-current="${state.menu===key?'page':'false'}">${mobile?'':svg[key]}<span>${label}</span></button>`).join('');document.querySelector('.nav-list').innerHTML=make(false);document.querySelector('.mobile-nav').innerHTML=make(true)}
function openSelection(id,el){state.focusReturn=el?.dataset?.select||(el?.dataset?.action?`${el.dataset.action}:${el.dataset.id||''}`:null);if(id==='guest-tab')state.guestTab='guest';state.selected=id;state.saveStatus='';if(state.drafts[id])state.draft=state.drafts[id];else if(id.startsWith('link:')){const item=state.data.links.find(x=>x.id===id.slice(5));state.draft={kind:'link',id:item.id,initial:clone(item),value:clone(item)};state.drafts[id]=state.draft}else if(id==='link-new'){state.draft={kind:'link',id:null,initial:{id:'draft',title:'',url:'https://',description:'',thumbnail:'',hidden:false,blocked:false},value:{id:'draft',title:'',url:'https://',description:'',thumbnail:'',hidden:false,blocked:false}};state.drafts[id]=state.draft}else if(id.startsWith('portfolio:')){const item=state.data.portfolio.find(x=>x.id===id.slice(10));state.draft={kind:'portfolio',id:item.id,initial:clone(item),value:clone(item)};state.drafts[id]=state.draft}else if(id==='portfolio-new'){state.draft={kind:'portfolio',id:null,initial:{id:'draft',title:'',url:'',description:''},value:{id:'draft',title:'',url:'',description:''}};state.drafts[id]=state.draft}else state.draft=null;render();requestAnimationFrame(()=>document.getElementById('panel-title')?.focus({preventScroll:true}))}
function tag(label){return `<span class="edit-tag">${label} · 편집</span>`}
function selectButton(id,label,markup,extra=''){return `<section class="public-section ${state.selected===id?'is-selected':''}" data-section="${id}">${tag(label)}<button class="section-hit" data-select="${id}" aria-label="${label} 구역 편집">${markup}</button>${extra}</section>`}
function publicMarkup(){const c=state.data.creator;const guestMode=state.menu==='guest';const profileFocus=state.menu==='profile'&&!(matchMedia('(max-width:1023px)').matches&&state.mobilePreview);const previewOnly=state.menu!=='edit'||!state.editMode;let out='<div class="public '+(previewOnly?'public-preview':'editing')+'">';
const avatar=c.photo?`<img src="${esc(c.photo)}" alt="프로필 사진">`:'<svg viewBox="0 0 48 48" aria-hidden="true" fill="currentColor"><circle cx="24" cy="16" r="9"/><path d="M7 43c1-10 7-16 17-16s16 6 17 16H7Z"/></svg>';
const profile=`<header class="public-profile"><div class="public-avatar">${avatar}</div>${c.name?`<h2 class="public-name">${esc(c.name)}</h2>`:''}${c.bio?`<p class="public-bio">${esc(c.bio)}</p>`:''}</header>`;
out+=`<section class="public-section ${profileFocus?'is-selected':' '+(state.menu==='profile'?'':'')}" data-section="profile" data-select="profile">${tag('프로필')}<button class="sr-only" data-select="profile" aria-label="프로필 편집">프로필 편집</button>${profile}</section>`;
const socials=state.data.socials.map(s=>`<button type="button" aria-label="${esc(s.platform)}">${snsGlyph(s.platform)}</button>`).join('');
out+=`<section class="public-section public-social-wrap ${profileFocus?'is-selected':''}" data-section="social" data-select="social">${tag('SNS 채널')}<button class="sr-only" data-select="social" aria-label="SNS 채널 편집">SNS 채널 편집</button><div class="socials">${socials}</div></section>`;
const tabs=state.guestEnabled?`<div class="tabs" role="tablist" aria-label="공개 페이지"><button role="tab" aria-selected="${state.guestTab==='links'}" data-action="preview-links">링크</button><button role="tab" aria-selected="${state.guestTab==='guest'}" data-action="preview-guest">방명록</button></div>`:'';out+=tabs;
if(guestMode||state.guestTab==='guest'){const posts=state.data.guestbook.filter(g=>!g.secret&&!g.hidden).map(g=>`<div class="guest-post"><div class="public-guest-head"><strong>${esc(g.name||'크리링 회원')}</strong><div class="mono">${esc(g.date)}</div></div><p>${esc(g.text)}</p></div>`).join('');out+=`<section class="public-section ${state.selected==='guest-tab'?'is-selected':''}" data-section="guest-tab" data-select="guest-tab">${tag('방명록')}<button class="sr-only" data-select="guest-tab" aria-label="방명록 탭 편집">방명록 탭 편집</button>${posts}<div class="guest-guidance">방명록은 로그인한 회원만 남길 수 있어요.<br><button class="btn small" disabled>로그인하고 남기기</button></div></section>`}
else {let links=visibleLinks().slice();if(state.draft?.kind==='link'){if(state.draft.id){const i=links.findIndex(x=>x.id===state.draft.id);if(i>=0)links[i]=state.draft.value}else if(state.draft.value.title.trim())links.push(state.draft.value)}const linkCards=links.map(l=>`<button class="public-link edit-item ${state.selected==='link:'+l.id?'is-selected':''}" data-select="link:${l.id}" aria-label="${esc(l.title)} 링크 편집">${l.thumbnail?`<img class="public-thumb" src="${esc(l.thumbnail)}" alt="">`:`<span class="favicon">${esc(new URL(l.url,'https://fallback.invalid').hostname[0]?.toUpperCase()||'링')}</span>`}<span class="public-link-copy"><strong>${esc(l.title)}</strong>${l.description?`<p>${esc(l.description)}</p>`:''}</span></button>`).join('');const linkExtra=state.menu==='edit'&&state.editMode?((visibleLinks().length>=5)?'<div class=\"limit-note\">무료로는 링크를 5개까지 보이게 둘 수 있어요. 숨긴 링크는 한도에 들어가지 않아요.</div>':'<button class=\"insert-row\" data-select=\"link-new\">+ 링크 추가</button>'):' ';out+=`<section class="public-section public-section-links ${state.selected==='links'||state.selected?.startsWith('link:')?'is-selected':''}" data-section="links" data-select="links">${tag(state.selected?.startsWith('link:')?'링크 · '+(state.draft?.value.title||''):'외부 링크')}<button class="sr-only" data-select="links" aria-label="외부 링크 구역 편집">외부 링크 구역 편집</button><div class="public-links">${linkCards}</div>${linkExtra}</section>`;
let portfolio=state.data.portfolio.slice();if(state.draft?.kind==='portfolio'){if(state.draft.id){const i=portfolio.findIndex(x=>x.id===state.draft.id);if(i>=0)portfolio[i]=state.draft.value}else if(state.draft.value.title.trim())portfolio.push(state.draft.value)}const cards=portfolio.map(item=>`<button class="portfolio-card edit-item ${state.selected==='portfolio:'+item.id?'is-selected':''}" data-select="portfolio:${item.id}" aria-label="${esc(item.title)} 포트폴리오 편집">${item.thumbnail?`<img class="portfolio-image" src="${esc(item.thumbnail)}" alt="">`:'<div class="portfolio-image"></div>'}<strong>${esc(item.title)}</strong><p>${esc(item.description)}</p></button>`).join('');const portExtra=state.menu==='edit'&&state.editMode?'<button class="insert-row" data-select="portfolio-new">+ 포트폴리오 추가</button>':'';out+=`<section class="public-section public-section-portfolio ${state.selected==='portfolio'||state.selected?.startsWith('portfolio:')?'is-selected':''}" data-section="portfolio" data-select="portfolio">${tag(state.selected?.startsWith('portfolio:')?'포트폴리오 · '+(state.draft?.value.title||''):'포트폴리오')}<button class="sr-only" data-select="portfolio" aria-label="포트폴리오 구역 편집">포트폴리오 구역 편집</button><h3 class="portfolio-title">포트폴리오</h3>${cards}${portExtra}</section><footer class="credit">크리링 · 개인정보 처리방침</footer>`}
out+='</div>';return out}
function statusLine(){if(!state.saveStatus)return '';const error=state.saveStatus.includes('연결')||state.saveStatus.includes('차단');return `<div class="status ${error?'error':'ok'}" role="${error?'alert':'status'}">${esc(state.saveStatus)}${error?'<button class="btn small" data-action="retry-save">다시 시도</button>':''}</div>`}
function field(label,key,value,max,area=false){return `<label class="field"><span>${label}</span>${area?`<textarea class="textarea" data-field="${key}" maxlength="${max}">${esc(value)}</textarea>`:`<input class="input" data-field="${key}" maxlength="${max}" value="${esc(value)}">`}<span class="counter">${String(value||'').length}/${max}</span></label>`}
function btn(label,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${label}</button>`}
function backHead(title,desc=''){return `<div class="inspector-head"><button class="back" data-action="all">← 전체</button><h1 id="panel-title" tabindex="-1">${title}</h1>${desc?`<p>${desc}</p>`:''}</div>`}
function formMarkup(){if(!state.draft)return '';const d=state.draft.value,kind=state.draft.kind,isLink=kind==='link',saved=state.draft.initial;const changed=JSON.stringify(d)!==JSON.stringify(saved);const list=kind==='link'?state.data.links:state.data.portfolio;const idx=list.findIndex(x=>x.id===state.draft.id);return `<div class="card form-card"><div class="card-title"><div><h2>${state.draft.id?(isLink?'링크 수정':'포트폴리오 수정'):(isLink?'새 링크':'포트폴리오 추가')}</h2></div>${changed?'<span class="badge dirty-badge">저장 안 함</span>':''}</div>${field(isLink?'표시 이름':'제목','draft.title',d.title,isLink?60:60)}${isLink?`<label class="field"><span>주소</span><input class="input ${state.demo==='blocked-save'&&state.saveStatus.includes('차단 목록')?'error':''} data-field="draft.url" value="${esc(d.url)}"><span class="help">http:// 또는 https://로 시작하는 주소만 저장할 수 있어요.</span></label>`:`<label class="field"><span>주소</span><input class="input ${state.demo==='blocked-save'&&state.saveStatus.includes('차단 목록')?'error':''} data-field="draft.url" value="${esc(d.url)}"></label>`}${isLink?field('설명','draft.description',d.description,120,true):field('설명','draft.description',d.description,200,true)}<div class="field"><span class="label">${isLink?'썸네일':'이미지'}</span><div class="row"><span class="port-thumb"></span><input id="draft-photo-input" type="file" accept="image/*" hidden><button class="btn small" data-action="image-pick">사진 고르기</button><button class="btn small" data-action="image-clear">지우기</button></div></div>${isLink&&d.blocked?'<p class="status error">차단된 링크는 수정할 수 없어요.</p>':''}<div class="actions form-actions">${btn('저장','save-form','primary')}${btn('취소','cancel-form')}${state.draft.id?btn('삭제','delete-form','danger'):''}</div>${statusLine()}</div>`}
function linkList(){const all=state.demo==='empty'?[]:state.data.links,visible=all.filter(x=>!x.hidden&&!x.blocked),full=visible.length>=5,slot=state.account==='slot',items=slot?currentCreatorBanners():[];const adRow=slot?`<div class="item-row ad-order-row" draggable="true" data-order-index="${state.adPosition}" data-ad-order tabindex="0"><button class="grip" data-action="ad-grip" aria-label="배너 슬롯 순서 바꾸기">${svg.grip}</button><div class="item-copy"><strong>배너 슬롯</strong><span>보이는 배너 ${visibleCreatorBanners().length}장</span></div><button class="btn small" data-select="banner-slot">수정</button></div>`:`<div class="item-row ad-order-row" draggable="true" data-order-index="${state.adPosition}" data-ad-order tabindex="0"><button class="grip" data-action="ad-grip" aria-label="크리링 광고 블록 순서 바꾸기">${svg.grip}</button><div class="item-copy"><strong><span class="badge">광고</span> 크리링 광고 블록</strong><span>지울 수 없고 위치만 바꿀 수 있어요</span></div></div>`;const rows=all.map(l=>`<div class="item-row ${l.hidden?'hidden':''}" draggable="true" data-order-index="${state.data.links.indexOf(l)}"><button class="grip" aria-label="${esc(l.title)} 링크 순서 바꾸기">${svg.grip}</button><div class="item-copy"><strong>${esc(l.title)} ${l.hidden?'<span class="badge">숨김</span>':''}${l.blocked?'<span class="badge error">차단됨</span>':''}</strong><span>${esc(l.url.replace(/^https?:\/\//,''))}</span>${l.blocked?`<span class="reason">크리링이 이 링크를 차단해 방문자에게 보이지 않아요. 사유: ${esc(l.reason)}</span>`:''}</div><div class="row-actions"><button class="switch" role="switch" aria-checked="${!l.hidden&&!l.blocked}" ${l.blocked?'disabled':''} data-action="toggle-link" data-id="${l.id}" aria-label="${esc(l.title)} 숨기기"><span class="track"><span class="knob"></span></span><span>${l.blocked?'잠김':l.hidden?'숨김':'표시'}</span></button><button class="btn small" data-action="edit-link" data-id="${l.id}">수정</button></div></div>`);const insert=Math.min(rows.length,Math.max(0,state.adPosition===0?0:state.adPosition));rows.splice(insert,0,adRow);return `${backHead('외부 링크','손잡이를 끌거나 키보드로 순서를 바꿀 수 있어요. 숨긴 링크와 차단된 링크는 방문자에게 보이지 않고 한도에도 들어가지 않아요.')}<article class="card"><div class="card-title"><div><h2>링크 목록</h2><p>숨긴 링크 포함 전체 ${all.length}/50개</p></div><span class="badge ${full?'warn':''}">보이는 링크 ${full?'5':visible.length}/5</span></div><div class="row-list">${rows.join('')}</div>${full?'<p class="status error">보이는 링크 한도(5개)에 도달했어요. 다른 링크를 숨기거나 지우면 새 링크를 추가할 수 있어요. 한도를 늘리려면 크리링 운영자에게 문의해 주세요.</p>':''}<p class="help space-top-8">숨긴 링크를 포함해 링크는 최대 50개까지 둘 수 있어요.</p>${full?'<div class="limit-note">무료로는 링크를 5개까지 보이게 둘 수 있어요. 숨긴 링크는 한도에 들어가지 않아요.</div>':btn('링크 추가','link-new','primary')}${statusLine()}</article>${formMarkup()}`}

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action;if(a==='ad-prev'||a==='ad-next'){let track=el.closest('.ad-card').querySelector('.ad-track');track.scrollBy({left:(a==='ad-next'?1:-1)*track.clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return}if(a==='open-links'){state.selected='links';render();return}if(a==='slot-image'){document.getElementById('banner-file')?.click();return}if(a==='slot-image-clear'&&state.slotForm){state.slotForm.value.image='';state.dirtySlot=true;render();return}if(a==='slot-add'){if(state.slotItems.length>=5){state.demo='limit';render();return}openSlotForm();return}if(a==='edit-slot'||a==='slot-edit'){openSlotForm(Number(el.dataset.index));return}if(a==='slot-cancel'){state.slotForm=null;state.dirtySlot=false;state.selected='banner-slot';render();return}if(a==='slot-delete'){if(confirm('이 배너를 지울까요? 지운 배너는 되돌릴 수 없어요.')){state.slotItems.splice(state.slotForm.id,1);state.slotForm=null;render()}return}if(a==='slot-toggle'){let x=state.slotItems[Number(el.dataset.index)];if(x&&!x.blocked)x.hidden=!x.hidden;render();return}if(a==='slot-retry'){state.demo='ready';state.saveStatus='';document.querySelector('[data-action=slot-save]')?.click();return}if(a==='slot-save'){if(state.demo==='saving'){render();return}let f=state.slotForm.value;if(!f.image){state.saveStatus='배너 이미지를 올려 주세요.';render();return}if(!f.alt){state.saveStatus='대체 문구를 적어 주세요.';render();return}if(f.url&&!/^https?:\/\//.test(f.url)){state.saveStatus='http:// 또는 https://로 시작하는 올바른 주소를 입력해 주세요.';render();return}if(state.demo==='save-fail'){render();return}if(state.slotForm.id===null)state.slotItems.push(f);else state.slotItems[state.slotForm.id]=f;state.slotForm=null;state.dirtySlot=false;state.demo='ready';state.selected='banner-slot';render();return}if(a==='admin-new'){adminDialog('new');return}if(a==='admin-edit'){adminDialog('edit',Number(el.dataset.id));return}if(a==='filter'){state.adminFilter=el.dataset.filter;render();return}if(a==='admin-take'){if(confirm('이 배너를 내릴까요? 게시 끝을 지금으로 바꿔 모든 랜딩에서 바로 빠져요.')){let i=Number(el.dataset.id);state.adminAds[i].status='끝남';state.adminAds[i].end='2026-10-09 00:00';render()}return}if(a==='grant-slot'){let msg=state.slotGranted?`회수하면 같은 자리에 다시 크리링 광고가 나와요. 크리에이터가 만든 배너 ${currentCreatorBanners().length}장은 지우지 않고 보관해요.`:'이 계정의 모든 랜딩에서 광고 블록 자리가 크리에이터 배너 슬롯으로 바뀌어요. 부여할까요?';if(confirm(msg)){state.slotGranted=!state.slotGranted;state.slotEnabled=state.slotGranted;if(state.slotGranted){state.slotItems=clone(creatorBanners).map((x,i)=>({...x,hidden:i===2,blocked:false}))}state.wasRevoked=!state.slotGranted;state.account=state.slotGranted?'slot':'free';state.grantMessage=state.slotGranted?'배너 슬롯을 부여했어요.':'배너 슬롯을 회수했어요.';render()}return}if(a==='admin-retry'){state.demo='ready';render();return}if(a==='admin-block-link'){let x=state.data.links[Number(el.dataset.index)],reason=el.closest('.item-row,.item-card')?.querySelector('input')?.value;if(x){x.blocked=!x.blocked;x.reason=reason||'운영자가 차단한 주소예요.';render()}return}if(a==='suspend'){if(confirm('이 계정의 이용을 정지할까요?')){state.creatorSuspended=!state.creatorSuspended;render()}return}if(a==='admin-block-banner'){let x=state.slotItems[Number(el.dataset.index)||0];if(x){x.blocked=!x.blocked;state.demo=x.blocked?'blocked':'ready';render()}return}if(a==='ad-grip'){state.grabbingAd=!state.grabbingAd;return}});
document.addEventListener('change',e=>{if(e.target.id==='banner-file'&&state.slotForm&&e.target.files?.[0]){let f=e.target.files[0];if(f.size>4*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type)){state.saveStatus='이미지를 올리지 못했어요. 4MB 이하 JPG·PNG·WebP인지 확인해 주세요.';render();return}state.slotForm.value.image=URL.createObjectURL(f);state.dirtySlot=true;render()}if(e.target.id==='demo-state'){state.demo=e.target.value;if(state.slotItems?.[1])state.slotItems[1].blocked=state.demo==='blocked';if(state.demo==='limit')state.slotItems=[...clone(creatorBanners).map(x=>({...x,hidden:!x.url,blocked:false})),{image:true,alt:'가을 브이로그 촬영 장비 정리',title:'가을 브이로그 촬영 장비 정리',sub:'촬영 준비를 차근차근',tone:'--ds-color-surface-raised',url:'https://crelink.me/p/k3x9q2',hidden:true},{image:true,alt:'10월 라이브 방송 일정',title:'10월 라이브 방송 일정',sub:'이번 달 방송 날짜를 확인해요',tone:'--ds-color-status-positive-subtle',url:'https://crelink.me/p/k3x9q2',hidden:true}];else if(state.slotItems.length>3)state.slotItems=clone(creatorBanners).map((x,i)=>({...x,hidden:i===2,blocked:false}));if(state.demo!=='limit')syncSlotVisibility();render()}if(e.target.id==='demo-screen'){state.screen=e.target.value;state.menu='edit';state.selected=null;render()}if(e.target.id==='demo-account'){state.account=e.target.value;state.slotGranted=state.account==='slot';if(state.slotGranted){state.slotItems=clone(creatorBanners).map((x,i)=>({...x,hidden:i===2,blocked:false}));syncSlotVisibility()}render()}if(e.target.id==='demo-count'){state.bannerCount=e.target.value==='default'?'default':Number(e.target.value);syncSlotVisibility();state.slide=0;render()}if(e.target.id==='demo-position'){state.adPosition=Number(e.target.value);render()}if(e.target.id==='demo-guest'){state.guestEnabled=e.target.value==='on';render()}});
document.addEventListener('input',e=>{if(e.target.dataset.slotField&&state.slotForm){state.slotForm.value[e.target.dataset.slotField]=e.target.value;state.dirtySlot=true;let c=e.target.closest('.field')?.querySelector('.counter');if(c)c.textContent=`${e.target.value.length}/100`;let p=document.querySelector('.banner-preview');if(p)p.innerHTML=bannerSvg(state.slotForm.value)}});
document.addEventListener('keydown',e=>{let car=e.target.closest('.ad-card');if(car&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();let track=car.querySelector('.ad-track');track.scrollBy({left:(e.key==='ArrowRight'?1:-1)*track.clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return}let row=e.target.closest('[data-ad-order]');if(!row)return;if(e.key===' '){e.preventDefault();if(state.grabbingAd){state.grabbingAd=false;row.setAttribute('aria-grabbed','false');render();requestAnimationFrame(()=>{document.querySelector('[data-ad-order] .grip')?.focus();let live=document.getElementById('reorder-live');if(live)live.textContent=`크리링 광고 블록을 ${state.adPosition+1}번째 자리로 옮겼어요.`})}else{state.grabbingAd=true;row.setAttribute('aria-grabbed','true')}return}if(state.grabbingAd&&e.key==='Escape'){e.preventDefault();state.grabbingAd=false;row.setAttribute('aria-grabbed','false');return}if(state.grabbingAd&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();state.adPosition=Math.max(0,Math.min(4,state.adPosition+(e.key==='ArrowUp'?-1:1)));let live=document.getElementById('reorder-live');if(live)live.textContent=`크리링 광고 블록을 ${state.adPosition+1}번째 자리로 옮겼어요.`;let ctl=document.getElementById('demo-position');if(ctl)ctl.value=String(state.adPosition);return}});
document.addEventListener('scroll',e=>{let track=e.target.closest?.('.ad-track');if(!track)return;let card=track.closest('.ad-card'),items=[...track.querySelectorAll('.ad-slide')],n=Math.max(0,Math.min(items.length-1,Math.round(track.scrollLeft/(track.clientWidth||1))));items.forEach((x,i)=>x.querySelector('a')?.setAttribute('tabindex',i===n?'0':'-1'));let count=card.querySelector('.ad-counter'),live=card.querySelector('.ad-live');if(count)count.textContent=`${n+1} / ${items.length}`;if(live)live.textContent=`${items.length}장 중 ${n+1}번째 배너`},true);document.addEventListener('dragstart',e=>{let row=e.target.closest('[data-ad-order]');if(row){state.grabbingAd=true;e.dataTransfer.setData('text/plain','ad');return}let slotRow=e.target.closest('[data-slot-order]');if(slotRow){state.dragSlot=Number(slotRow.dataset.slotOrder);e.dataTransfer.setData('text/plain','slot')}});document.addEventListener('dragover',e=>{if(state.grabbingAd&&e.target.closest('.item-row'))e.preventDefault()});document.addEventListener('drop',e=>{if(state.grabbingAd){e.preventDefault();let row=e.target.closest('.item-row');state.adPosition=Math.max(0,Math.min(4,Number(row?.dataset.index??state.adPosition+1)));state.grabbingAd=false;render();let live=document.getElementById('reorder-live');if(live)live.textContent=`크리링 광고 블록을 ${state.adPosition+1}번째 자리로 옮겼어요.`}});
/* 2회차 다듬기: 운영자 실제 마크업 구조와 공개 화면 흐름을 반영합니다. */
function arrowIcon(dir){return `<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="${dir==='left'?'M15 5 8 12l7 7':'M9 5l7 7-7 7'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function selectedPanel(){return adPanel()||baseSelectedPanel()}
/* 이번 회차 보강: 목록 의미 구조, 반응형 운영자 상세, 프레임 내부 스크롤 */
function normalizeLinkList(){document.querySelectorAll('#preview .public-links').forEach(root=>{if(root.tagName!=='UL'){const list=document.createElement('ul');list.className=root.className;list.classList.add('link-list');list.setAttribute('aria-label','외부 링크');while(root.firstChild){const child=root.firstChild;if(child.nodeType===1){const li=document.createElement('li');li.className='link-list-item';li.append(child);list.append(li)}else list.append(child)}root.replaceWith(list)}else{[...root.children].forEach(child=>{if(child.tagName!=='LI'){const li=document.createElement('li');li.className='link-list-item';child.before(li);li.append(child)}})}})}
function syncCarouselControls(){document.querySelectorAll('.ad-card').forEach(card=>{const track=card.querySelector('.ad-track');if(!track)return;const n=Math.max(0,Math.min(track.children.length-1,Math.round(track.scrollLeft/(track.clientWidth||1))));const prev=card.querySelector('.ad-prev'),next=card.querySelector('.ad-next');if(prev)prev.disabled=n===0;if(next)next.disabled=n===track.children.length-1})}
function scrollPromoIntoFrame(){if(!matchMedia('(min-width:1024px)').matches||state.screen!=='페이지 편집'||!['links','ad-block'].includes(state.selected))return;const frame=document.querySelector('.device-screen'),target=frame?.querySelector('.promo-list-item');if(!frame||!target)return;const top=target.getBoundingClientRect().top-frame.getBoundingClientRect().top;if(top<0||top+target.offsetHeight>frame.clientHeight)frame.scrollTop+=top-Math.max(12,(frame.clientHeight-target.offsetHeight)/2)}
function patchMobileSlotSheet(){if(!matchMedia('(max-width:1023px)').matches||state.selected!=='banner-slot')return;const panel=document.querySelector('.inspector'),title=panel?.querySelector('.mobile-sheet-head h2'),footer=panel?.querySelector('.mobile-sheet-actions');if(title)title.textContent=state.slotForm?(state.slotForm.id===null?'새 배너':'배너 · '+state.slotForm.value.alt):'배너 슬롯';panel?.querySelector('.sheet-content [data-action="slot-save"]')?.closest('.actions')?.remove();if(!footer)return;if(!state.slotForm){footer.hidden=true;return}footer.hidden=false;footer.innerHTML=btn('저장','slot-save','primary')+btn('취소','slot-cancel','secondary')+(state.slotForm.id!==null?btn('삭제','slot-delete','secondary danger'):'')}


/* 최종 렌더링: 모든 표시는 단일 상태 데이터에서 계산 */
function selectedBannerCount(){return String(state.bannerCount)==='0'?0:String(state.bannerCount)==='1'?1:3}
function syncSlotVisibility(){const count=selectedBannerCount();currentCreatorBanners().forEach((item,index)=>{item.hidden=count===0||index>=(count===1?1:2);item.blocked=state.demo==='blocked'&&index===1})}
function currentCreatorBanners(){return state.slotItems||creatorBanners}
function visibleCreatorBanners(){return currentCreatorBanners().filter(x=>!x.hidden&&!x.blocked).slice(0,selectedBannerCount())}

render();

document.addEventListener('scroll',e=>{if(e.target?.matches?.('.ad-track'))syncCarouselControls()},true);</script>
