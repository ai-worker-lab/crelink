const items=[['edit','페이지 편집'],['profile','프로필'],['guest','방명록'],['address','주소 설정']];

function dirty(){const profile=state.data.creator.name!==state.saved.creator.name||state.data.creator.bio!==state.saved.creator.bio||state.data.creator.photo!==state.saved.creator.photo;const socials=JSON.stringify(state.data.socials)!==JSON.stringify(state.saved.socials);const forms=Object.values(state.drafts).some(d=>JSON.stringify(d.value)!==JSON.stringify(d.initial));return profile||socials||forms}

function openSelection(id,el){state.focusReturn=el?.dataset?.select||(el?.dataset?.action?`${el.dataset.action}:${el.dataset.id||''}`:null);if(id==='guest-tab')state.guestTab='guest';state.selected=id;state.saveStatus='';if(state.drafts[id])state.draft=state.drafts[id];else if(id.startsWith('link:')){const item=state.data.links.find(x=>x.id===id.slice(5));state.draft={kind:'link',id:item.id,initial:clone(item),value:clone(item)};state.drafts[id]=state.draft}else if(id==='link-new'){state.draft={kind:'link',id:null,initial:{id:'draft',title:'',url:'https://',description:'',thumbnail:'',hidden:false,blocked:false},value:{id:'draft',title:'',url:'https://',description:'',thumbnail:'',hidden:false,blocked:false}};state.drafts[id]=state.draft}else if(id.startsWith('portfolio:')){const item=state.data.portfolio.find(x=>x.id===id.slice(10));state.draft={kind:'portfolio',id:item.id,initial:clone(item),value:clone(item)};state.drafts[id]=state.draft}else if(id==='portfolio-new'){state.draft={kind:'portfolio',id:null,initial:{id:'draft',title:'',url:'',description:''},value:{id:'draft',title:'',url:'',description:''}};state.drafts[id]=state.draft}else state.draft=null;render();requestAnimationFrame(()=>document.getElementById('panel-title')?.focus())}

function publicMarkup(){const c=state.data.creator;const guestMode=state.menu==='guest';const profileFocus=state.menu==='profile'&&!(matchMedia('(max-width:1023px)').matches&&state.mobilePreview);const previewOnly=state.menu!=='edit'||!state.editMode;let out='<div class="public '+(previewOnly?'public-preview':'editing')+'">';
const avatar=c.photo?`<img src="${esc(c.photo)}" alt="프로필 사진">`:'<svg viewBox="0 0 48 48" aria-hidden="true" fill="currentColor"><circle cx="24" cy="16" r="9"/><path d="M7 43c1-10 7-16 17-16s16 6 17 16H7Z"/></svg>';

out+=`<section class="public-section ${profileFocus?'is-selected':' '+(state.menu==='profile'?'':'')}" data-section="profile" data-select="profile">${tag('프로필')}<button class="sr-only" data-select="profile" aria-label="프로필 편집">프로필 편집</button>${profile}</section>`;
const socials=state.data.socials.map(s=>`<button type="button" aria-label="${esc(s.platform)}">${snsGlyph(s.platform)}</button>`).join('');
out+=`<section class="public-section public-social-wrap ${profileFocus?'is-selected':''}" data-section="social" data-select="social">${tag('SNS 채널')}<button class="sr-only" data-select="social" aria-label="SNS 채널 편집">SNS 채널 편집</button><div class="socials">${socials}</div></section>`;
const tabs=state.guestEnabled?`<div class="tabs" role="tablist" aria-label="공개 페이지"><button role="tab" aria-selected="${state.guestTab==='links'}" data-action="preview-links">링크</button><button role="tab" aria-selected="${state.guestTab==='guest'}" data-action="preview-guest">방명록</button></div>`:'';out+=tabs;
if(guestMode||state.guestTab==='guest'){const posts=state.data.guestbook.filter(g=>!g.secret&&!g.hidden).map(g=>`<div class="guest-post"><div class="public-guest-head"><strong>${esc(g.name||'크리링 회원')}</strong><div class="mono">${esc(g.date)}</div></div><p>${esc(g.text)}</p></div>`).join('');out+=`<section class="public-section ${state.selected==='guest-tab'?'is-selected':''}" data-section="guest-tab" data-select="guest-tab">${tag('방명록')}<button class="sr-only" data-select="guest-tab" aria-label="방명록 탭 편집">방명록 탭 편집</button>${posts}<div class="guest-guidance">방명록은 로그인한 회원만 남길 수 있어요.<br><button class="btn small" disabled>로그인하고 남기기</button></div></section>`}
else {let links=visibleLinks().slice();if(state.draft?.kind==='link'){if(state.draft.id){const i=links.findIndex(x=>x.id===state.draft.id);if(i>=0)links[i]=state.draft.value}else if(state.draft.value.title.trim())links.push(state.draft.value)}const linkCards=links.map(l=>`<button class="public-link edit-item ${state.selected==='link:'+l.id?'is-selected':''}" data-select="link:${l.id}" aria-label="${esc(l.title)} 링크 편집">${l.thumbnail?`<img class="public-thumb" src="${esc(l.thumbnail)}" alt="">`:`<span class="favicon">${esc(new URL(l.url,'https://fallback.invalid').hostname[0]?.toUpperCase()||'링')}</span>`}<span class="public-link-copy"><strong>${esc(l.title)}</strong>${l.description?`<p>${esc(l.description)}</p>`:''}</span></button>`).join('');const linkExtra=state.menu==='edit'&&state.editMode?((state.demo==='limit'||visibleLinks().length>=5)?'<div class=\"limit-note\">무료로는 링크를 5개까지 보이게 둘 수 있어요. 숨긴 링크는 한도에 들어가지 않아요.</div>':'<button class=\"insert-row\" data-select=\"link-new\">+ 링크 추가</button>'):' ';out+=`<section class="public-section public-section-links ${state.selected==='links'||state.selected?.startsWith('link:')?'is-selected':''}" data-section="links" data-select="links">${tag(state.selected?.startsWith('link:')?'링크 · '+(state.draft?.value.title||''):'외부 링크')}<button class="sr-only" data-select="links" aria-label="외부 링크 구역 편집">외부 링크 구역 편집</button><div class="public-links">${linkCards}</div>${linkExtra}</section>`;

out+='</div>';return out}
function statusLine(){if(!state.saveStatus)return '';const error=state.saveStatus.includes('연결')||state.saveStatus.includes('차단');return `<div class="status ${error?'error':'ok'}" role="${error?'alert':'status'}">${esc(state.saveStatus)}${error?'<button class="btn small" data-action="retry-save">다시 시도</button>':''}</div>`}
function field(label,key,value,max,area=false){return `<label class="field"><span>${label}</span>${area?`<textarea class="textarea" data-field="${key}" maxlength="${max}">${esc(value)}</textarea>`:`<input class="input" data-field="${key}" maxlength="${max}" value="${esc(value)}">`}<span class="counter">${String(value||'').length}/${max}</span></label>`}
function btn(label,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${label}</button>`}

function formMarkup(){if(!state.draft)return '';const d=state.draft.value,kind=state.draft.kind,isLink=kind==='link',saved=state.draft.initial;const changed=JSON.stringify(d)!==JSON.stringify(saved);const list=kind==='link'?state.data.links:state.data.portfolio;const idx=list.findIndex(x=>x.id===state.draft.id);return `<div class="card form-card"><div class="card-title"><div><h2>${state.draft.id?(isLink?'링크 수정':'포트폴리오 수정'):(isLink?'새 링크':'포트폴리오 추가')}</h2></div>${changed?'<span class="badge dirty-badge">저장 안 함</span>':''}</div>${field(isLink?'표시 이름':'제목','draft.title',d.title,isLink?60:60)}${isLink?`<label class="field"><span>주소</span><input class="input ${state.demo==='blocked-save'&&state.saveStatus.includes('차단 목록')?'error':''} data-field="draft.url" value="${esc(d.url)}"><span class="help">http:// 또는 https://로 시작하는 주소만 저장할 수 있어요.</span></label>`:`<label class="field"><span>주소</span><input class="input ${state.demo==='blocked-save'&&state.saveStatus.includes('차단 목록')?'error':''} data-field="draft.url" value="${esc(d.url)}"></label>`}${isLink?field('설명','draft.description',d.description,120,true):field('설명','draft.description',d.description,200,true)}<div class="field"><span class="label">${isLink?'썸네일':'이미지'}</span><div class="row"><span class="port-thumb"></span><input id="draft-photo-input" type="file" accept="image/*" hidden><button class="btn small" data-action="image-pick">사진 고르기</button><button class="btn small" data-action="image-clear">지우기</button></div></div>${isLink&&d.blocked?'<p class="status error">차단된 링크는 수정할 수 없어요.</p>':''}<div class="actions form-actions">${btn('저장','save-form','primary')}${btn('취소','cancel-form')}${state.draft.id?btn('삭제','delete-form','danger'):''}</div>${statusLine()}</div>`}
function linkList(){const all=state.demo==='empty'?[]:state.data.links;const visible=all.filter(x=>!x.hidden&&!x.blocked);const full=state.demo==='limit'||visible.length>=5;if(state.demo==='empty')return backHead('외부 링크','숨긴 링크와 차단된 링크는 방문자에게 보이지 않고 한도에도 들어가지 않아요.')+'<article class="card"><p class="help">아직 추가한 링크가 없어요. 링크를 추가하면 미리보기에 바로 보여요.</p>'+btn('링크 추가','link-new','primary')+'</article>';return `${backHead('외부 링크','손잡이를 끌거나 키보드로 순서를 바꿀 수 있어요. 숨긴 링크와 차단된 링크는 방문자에게 보이지 않고 한도에도 들어가지 않아요.')}<article class="card"><div class="card-title"><div><h2>링크 목록</h2><p>숨긴 링크 포함 전체 ${all.length}/50개</p></div><span class="badge ${full?'warn':''}">보이는 링크 ${full?'5':visible.length}/5</span></div><div class="row-list">${all.map(l=>`<div class="item-row ${l.hidden?'hidden':''}"><button class="grip" aria-label="${esc(l.title)} 링크 순서 바꾸기">${svg.grip}</button><div class="item-copy"><strong>${esc(l.title)} ${l.hidden?'<span class="badge">숨김</span>':''} ${l.blocked?'<span class="badge error">차단됨</span>':''}</strong><span>${esc(l.url.replace(/^https?:\/\//,''))}</span>${l.blocked?`<span class="reason">크리링이 이 링크를 차단해 방문자에게 보이지 않아요. 사유: ${esc(l.reason)}</span>`:''}</div><div class="row-actions"><button class="switch" role="switch" aria-checked="${!l.hidden&&!l.blocked}" ${l.blocked?'disabled':''} data-action="toggle-link" data-id="${l.id}" aria-label="${esc(l.title)} 숨기기"><span class="track"><span class="knob"></span></span><span>${l.blocked?'잠김':l.hidden?'숨김':'표시'}</span></button><button class="btn small" data-action="edit-link" data-id="${l.id}">수정</button></div></div>`).join('')}</div>${full?'<p class="status error">보이는 링크 한도(5개)에 도달했어요. 다른 링크를 숨기거나 지우면 새 링크를 추가할 수 있어요. 한도를 늘리려면 크리링 운영자에게 문의해 주세요.</p>':''}<p class="help space-top-8">숨긴 링크를 포함해 링크는 최대 50개까지 둘 수 있어요.</p>${(full?'<div class=\"limit-note\">무료로는 링크를 5개까지 보이게 둘 수 있어요. 숨긴 링크는 한도에 들어가지 않아요.</div>':btn('링크 추가','link-new','primary'))}${statusLine()}</article>${formMarkup()}`}
function portfolioPanel(){const source=state.demo==='empty'?[]:state.data.portfolio;if(state.demo==='empty')return backHead('포트폴리오','항목은 최대 20개까지 등록할 수 있어요.')+'<article class=\"card\"><p class=\"help\">아직 등록한 포트폴리오가 없어요.</p>'+btn('포트폴리오 추가','portfolio-new','primary')+'</article>';const rows=source.map((item,i)=>`<div class="item-row"><button class="grip" aria-label="${esc(item.title)} 순서 바꾸기">${svg.grip}</button><div class="item-copy"><strong>${esc(item.title)}</strong><span>${esc(item.url)}</span><span>${esc(item.description)}</span></div><div class="row-actions"><button class="btn small icon-action" data-action="port-up" data-index="${i}" aria-label="위로">${svg.up}</button><button class="btn small icon-action" data-action="port-down" data-index="${i}" aria-label="아래로">${svg.down}</button><button class="btn small" data-action="edit-portfolio" data-id="${item.id}">수정</button></div></div>`).join('');return `${backHead('포트폴리오','항목은 최대 20개까지 등록할 수 있어요.') }<article class="card"><div class="card-title"><h2>포트폴리오</h2><span class="count">${(state.demo==='empty'?0:source.length)}/20</span></div><div class="row-list">${rows}</div>${source.length<20?btn('포트폴리오 추가','portfolio-new'):''}</article>${formMarkup()}`}
function profilePanel(){const c=state.data.creator;const profileDirty=c.name!==state.saved.creator.name||c.bio!==state.saved.creator.bio||c.photo!==state.saved.creator.photo;const socialsDirty=JSON.stringify(state.data.socials)!==JSON.stringify(state.saved.socials);return `<div class="inspector-head"><h1 id="panel-title" tabindex="-1">프로필</h1><p>방문자가 처음 만나는 소개와 SNS 채널을 관리해요.</p></div><article class="card profile-form-card"><div class="card-title"><div><h2>프로필</h2><p>사진·이름·소개는 모두 선택 항목이에요.</p></div>${profileDirty?'<span class="badge">저장 안 함</span>':''}</div><div class="field"><span class="label">프로필 사진</span><div class="row"><span class="profile-image-avatar">${c.photo?'<img src="'+esc(c.photo)+'" alt="프로필 사진">':'<svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><circle cx="24" cy="16" r="9"/><path d="M7 43c1-10 7-16 17-16s16 6 17 16H7Z"/></svg>'}</span><button class="btn small" data-action="photo-pick">사진 고르기</button><button class="btn small" data-action="photo-clear">지우기</button><input id="photo-input" type="file" accept="image/*" hidden></div></div>${field('이름 (닉네임)','creator.name',c.name,40)}${field('소개','creator.bio',c.bio,300,true)}<p class="help">모두 선택 항목이에요. 비워 두면 방문자 화면에 보이지 않고, 프로필 사진이 없으면 기본 프로필이 보여요.</p><div class="actions">${btn('프로필 저장','profile-save','primary')}</div>${state.saveStatus?statusLine():''}</article><article class="card"><div class="card-title"><div><h2>SNS 채널</h2><p>최대 10개까지 추가할 수 있어요.</p></div>${socialsDirty?'<span class="badge">저장 안 함</span>':''}</div>${state.data.socials.map((s,i)=>`<div class="social-row"><select data-social-platform="${i}" aria-label="SNS 플랫폼">${['인스타그램','유튜브','틱톡','네이버 블로그','X','스레드','페이스북','기타'].map(x=>`<option ${s.platform===x?'selected':''}>${x}</option>`).join('')}</select><input class="input" data-social-url="${i}" value="${esc(s.url)}" aria-label="계정 주소"><button class="btn small" data-action="social-remove" data-index="${i}">빼기</button></div>`).join('')}${state.data.socials.length<10?btn('SNS 채널 추 function guestPanel(){const pub=state.data.guestbook.filter(x=>!x.secret&&!x.hidden);return `<div class="inspector-head"><h1 id="panel-title" tabindex="-1">방명록</h1><p>${state.guestEnabled?'방명록이 켜져 있어요':'방명록이 꺼져 있어요'}</p></div><article class="card"><div class="card-title"><div><h2>방명록 설정</h2><p>켜면 랜딩페이지에 링크·방명록 탭이 생기고 로그인한 회원이 글을 남길 수 있어요. 꺼도 남은 글은 지우지 않아요.</p></div><button class="switch" role="switch" aria-checked="${state.guestEnabled}" data-action="guest-toggle" aria-label="방명록 켜기"><span class="track"><span class="knob"></span></span></button></div>${btn('방명록 글 관리','guest-manage')}</article><article class="card"><div class="card-title"><div><h2>방명록 글 관리</h2><p>비밀글과 숨김 상태는 방문자에게 표시되지 않아요.</p></div></div>${state.data.guestbook.map(g=>`<div class="guest-entry ${g.hidden?'subtle':''}"><div class="guest-entry-head"><strong>${esc(g.name||'크리링 회원')}</strong>${g.secret?'<span class="badge">비밀글</span>':''}${g.hidden?'<span class="badge">숨김</span>':''}</div><div class="mono">${esc(g.date)}</div><p>${esc(g.text)}</p><button class="btn small" data-action="guest-hide" data-id="${g.id}">${g.hidden?'숨김 해제':'숨기기'}</button></div>`).join('')}${btn('더 보기','guest-more')}</article>`}
function addressPanel(){return `<div class="inspector-head"><h1 id="panel-title" tabindex="-1">주소 설정</h1><p>크리링 주소를 변경하면 30일 동안 다시 바꿀 수 없어요.</p></div><article class="card"><div class="card-title"><div><h2>주소 바꾸기</h2><p>바꾸면 30일 동안 다시 바꿀 수 없어요.</p></div></div><label class="field"><span>새 주소</span><div class="address-entry"><span class="mono">crelink.me/</span><input id="address-input" class="input" data-field="address.input" value="${esc(state.addressInput)}" maxlength="30"></div><span class="help">영소문자·숫자·하이픈(-) 3~30자</span></label><div class="actions">${btn('주소 바꾸기','address-save','primary')}</div>${statusLine()}</article><article class="card"><h2>계정</h2><p class="help space-top-8">${esc(state.data.creator.email)}</p></article>`}
function overviewPanel(){return `<div class="inspector-head"><span class="eyebrow">페이지 편집</span><h1 id="panel-title" tabindex="-1">페이지 편집</h1><p>방문자 화면에서 구역이나 항목을 선택해 편집해요.</p></div><h2 class="section-title">구역 선택</h2><div class="section-selection"><button class="choice-item" data-select="links"><span><strong>외부 링크</strong><span>보이는 링크 ${(state.demo==='empty'?0:visibleLinks().length)}/5${dirtyKind('link')?'<i class=\"badge\">저장 안 함</i>':''}</span></span></button><button class="choice-item" data-select="portfolio"><span><strong>포트폴리오</strong><span>${(state.demo==='empty'?0:state.data.portfolio.length)}/20${dirtyKind('portfolio')?'<i class=\"badge\">저장 안 함</i>':''}</span></span></button><button class="choice-item" data-select="guest-tab"><span><strong>방명록</strong><span>${state.guestEnabled?'켜짐':'꺼짐'}</span></span></button></div><p class="help space-top-12">프로필 머리와 SNS 채널은 프로필 메뉴에서 수정할 수 있어요.</p>${btn('프로필에서 고치기','to-profile')}</div>`}

function render(){nav();document.getElementById('demo-state').value=state.demo;const panel=document.getElementById('inspector');const desktop=matchMedia('(min-width:1024px)').matches;const isMobile=!desktop;document.getElementById('workspace').classList.toggle('mobile-panel-first',isMobile&&state.menu!=='edit'&&!state.mobilePreview);document.getElementById('workspace').classList.toggle('mobile-preview-first',isMobile&&state.mobilePreview);document.getElementById('stage-title').textContent=items.find(x=>x[0]===state.menu)?.[1]||'페이지 편집';document.getElementById('stage-description').textContent=state.menu==='edit'?'미리보기에서 고칠 곳을 눌러요.':'';document.getElementById('stage-description').hidden=state.menu!=='edit';document.getElementById('draft-chip').hidden=!dirty();document.getElementById('mobile-draft-chip').hidden=!dirty();document.getElementById('mobile-editor-toolbar').style.display='flex';document.querySelector('.mode-toggle').style.display='flex';
document.querySelector('.stage-address>span').textContent='crelink.me/'+state.data.creator.slug;document.querySelector('.toolbar-address>span').textContent='crelink.me/'+state.data.creator.slug;document.getElementById('device').classList.toggle('is-loading',state.demo==='loading');const content=state.demo==='loading'?'<div class="phone-skeleton"><div class="skel circle"></div><div class="skel"></div><div class="skel" style="height:54px"></div><div class="skel" style="height:54px"></div></div>':state.demo==='empty'?'<div class="public"><header class="public-profile"><div class="public-avatar"><svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><circle cx="24" cy="16" r="9"/><path d="M7 43c1-10 7-16 17-16s16 6 17 16H7Z"/></svg></div><p class="public-bio">아직 준비 중인 페이지예요.</p></header></div>'+(state.menu==='edit'&&state.editMode?'<button class="insert-row" data-select="link-new">+ 링크 추가</button><button class="insert-row" data-select="portfolio-new">+ 포트폴리오 추가</button>':''):publicMarkup();document.getElementById('preview').innerHTML=content;if(state.menu==='profile')document.querySelectorAll('#preview .public-section').forEach(x=>x.classList.toggle('is-dimmed',!x.matches('[data-section="profile"],[data-section="social"]')));
const sheet=state.menu==='edit'&&!!state.selected;panel.classList.toggle('sheet-open',isMobile&&sheet);panel.dataset.mode=isMobile?(state.mobilePreview?'hidden':state.menu==='edit'?(sheet?'sheet':'hidden'):'static'):'sheet';let panelHtml=state.menu==='edit'?(state.selected?selectedPanel():overviewPanel()):state.menu==='profile'?profilePanel():state.menu==='guest'?guestPanel():addressPanel();
if(isMobile&&sheet){const selected=state.selected||'';const draft=state.draft;const title=selected.startsWith('link:')?(draft?.id?'링크 · '+(draft.value.title||'링크'):'새 링크'):selected==='link-new'?'새 링크':selected.startsWith('portfolio:')?(draft?.id?'포트폴리오 · '+(draft.value.title||'포트폴리오'):'포트폴리오 추가'):selected==='portfolio-new'?'포트폴리오 추가':selected==='profile'||selected==='social'?'프로필':selected==='guest-tab'?'방명록':selected==='links'?'외부 링크':'포트폴리오';let contentHtml=panelHtml.replace(/<div class="inspector-head">[\s\S]*?<\/div>/,'');let footerHtml='';if(draft){contentHtml=contentHtml.replace(/<div class="actions form-actions">[\s\S]*?<\/div>/,'');footerHtml=btn('저장','save-form','primary')+(draft.id?btn('삭제','delete-form','danger'):'')}else if(selected==='profile'||selected==='social'){contentHtml='<p class="help space-top-12">프로필 메뉴에서 수정할 수 있어요.</p>';footerHtml=btn('프로필에서 고치기','to-profile','primary')}else footerHtml=btn('완료','close-sheet','primary');panelHtml=`<div class="mobile-sheet-head"><h2 id="panel-title" tabindex="-1">${title}</h2><button class="close-sheet" data-action="close-sheet" aria-label="닫기">${svg.close}</button></div><div class="sheet-content">${contentHtml}</div><div class="mobile-sheet-actions">${footerHtml}</div>`}
if(dirty()){panelHtml=panelHtml.replace('</h1>','</h1><span class="badge panel-dirty">저장 안 함</span>');panelHtml=panelHtml.replace('</h2><button class="close-sheet"','</h2><span class="badge panel-dirty">저장 안 함</span><button class="close-sheet"')}if(state.demo==='saving')panelHtml='<p class="status">저장 중…</p>'+panelHtml;document.getElementById('inspector-content').innerHTML=panelHtml;panel.classList.toggle('sheet-open',isMobile&&sheet);panel.dataset.mode=isMobile?(state.mobilePreview?'hidden':state.menu==='edit'?(sheet?'sheet':'hidden'):'static'):'sheet';document.getElementById('preview').classList.toggle('editing',state.menu==='edit'&&state.editMode);document.getElementById('preview').classList.toggle('public-preview',state.menu!=='edit'||!state.editMode);document.querySelector('[data-action="mode-edit"]').setAttribute('aria-pressed',String(!state.mobilePreview));document.querySelector('[data-action="mode-preview"]').setAttribute('aria-pressed',String(state.mobilePreview));

if(state.menu==='guest'){const tab=document.querySelector('[data-action="preview-guest"]');if(tab)tab.setAttribute('aria-selected','true')}

function setMenu(menu){state.menu=menu;state.selected=null;state.draft=null;state.saveStatus='';state.mobilePreview=false;state.editMode=menu==='edit';if(menu==='guest')state.guestTab='guest';else if(menu==='edit')state.guestTab='links';render();if(menu==='address'&&window.matchMedia('(max-width:1023px)').matches)document.getElementById('address-input')?.focus()}
function closeSheet(){const target=state.focusReturn;state.selected=null;state.draft=null;state.saveStatus='';render();requestAnimationFrame(()=>{if(target){let el;if(target.startsWith('edit-link:'))el=document.querySelector(`[data-action="edit-link"][data-id="${CSS.escape(target.slice(10))}"]`);else if(target.startsWith('edit-portfolio:'))el=document.querySelector(`[data-action="edit-portfolio"][data-id="${CSS.escape(target.slice(15))}"]`);else el=document.querySelector(`[data-select="${CSS.escape(target)}"]`);el?.focus()}else document.getElementById('panel-title')?.focus()})}
function saveForm(){if(!state.draft)return;if(state.demo==='save-fail'||state.demo==='blocked-save'){state.saveStatus=state.demo==='blocked-save'?'크리링 차단 목록에 있는 도메인이라 저장할 수 없어요.':'서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.';render();return}const d=state.draft.value;const list=state.draft.kind==='link'?state.data.links:state.data.portfolio;if(state.draft.id){const i=list.findIndex(x=>x.id===state.draft.id);if(i>=0)list[i]=clone(d)}else{d.id=(state.draft.kind==='link'?'link-':'portfolio-')+Date.now();list.push(clone(d))}if(state.draft.kind==='link')state.saved.links=clone(state.data.links);else state.saved.portfolio=clone(state.data.portfolio);delete state.drafts[state.selected];state.selected=null;state.draft=null;state.saveStatus='저장했어요.';render()}
document.addEventListener('click',e=>{const menu=e.target.closest('[data-menu]');if(menu){setMenu(menu.dataset.menu);return}const pick=e.target.closest('[data-select]');if(pick){if(state.menu!=='edit'||!state.editMode)return;openSelection(pick.dataset.select,pick);return}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
if(a==='all'||a==='close-sheet'){closeSheet();return}if(a==='mode-edit'){state.mobilePreview=false;state.editMode=state.menu==='edit';render();return}if(a==='mode-preview'){state.mobilePreview=true;state.editMode=false;render();document.getElementById('preview').scrollTop=0;return}if(a==='preview-links'){state.guestTab='links';if(state.menu==='edit'&&state.selected==='guest-tab'){state.selected=null;state.draft=null}render();return}if(a==='preview-guest'){state.guestTab='guest';if(state.menu==='edit')openSelection('guest-tab',el);else render();return}
if(a==='address-menu'){setMenu('address');requestAnimationFrame(()=>document.getElementById('address-input')?.focus());return}if(a==='to-profile'){setMenu('profile');return}if(a==='to-guest'||a==='guest-manage'){setMenu('guest');return}
if(a==='edit-link'){openSelection('link:'+el.dataset.id,el);return}if(a==='edit-portfolio'){openSelection('portfolio:'+el.dataset.id,el);return}if(a==='link-new'||a==='portfolio-new'){openSelection(a,el);return}
if(a==='save-form'){saveForm();return}if(a==='cancel-form'){delete state.drafts[state.selected];closeSheet();return}if(a==='delete-form'){if(confirm('이 항목을 지울까요? 지우면 되돌릴 수 없어요.')){const list=state.draft.kind==='link'?state.data.links:state.data.portfolio;state.data[state.draft.kind==='link'?'links':'portfolio']=list.filter(x=>x.id!==state.draft.id);state.saved[state.draft.kind==='link'?'links':'portfolio']=clone(state.data[state.draft.kind==='link'?'links':'portfolio']);delete state.drafts[state.selected];closeSheet()}return}
if(a==='toggle-link'){const item=state.data.links.find(x=>x.id===el.dataset.id);if(item&&!item.blocked){item.hidden=!item.hidden;state.saved.links=clone(state.data.links);render()}return}if(a==='guest-toggle'){state.guestEnabled=!state.guestEnabled;render();return}if(a==='guest-hide'){const g=state.data.guestbook.find(x=>x.id===el.dataset.id);if(g)g.hidden=!g.hidden;state.saved.guestbook=clone(state.data.guestbook);render();return}
if(a==='profile-save'){if(state.demo==='save-fail'){state.saveStatus='서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.';render();return}state.saved.creator=clone(state.data.creator);state.saveStatus='프로필을 저장했어요.';render();return}if(a==='social-save'){if(state.demo==='save-fail'){state.saveStatus='서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.';render();return}state.saved.socials=clone(state.data.socials);state.saveStatus='SNS 채널을 저장했어요.';render();return}if(a==='social-add'){if(state.data.socials.length<10)state.data.socials.push({platform:'기타',url:''});render();return}if(a==='social-remove'){state.data.socials.splice(Number(el.dataset.index),1);render();return}
if(a==='port-up'||a==='port-down'){const i=Number(el.dataset.index),j=i+(a==='port-up'?-1:1);if(j>=0&&j<state.data.portfolio.length)[state.data.portfolio[i],state.data.portfolio[j]]=[state.data.portfolio[j],state.data.portfolio[i]];state.saved.portfolio=clone(state.data.portfolio);render();return}
if(a==='copy'){navigator.clipboard?.writeText('https://crelink.me/'+state.data.creator.slug).catch(()=>{});el.textContent='복사했어요';setTimeout(()=>render(),900);return}if(a==='open-public'){window.open('https://crelink.me/'+state.data.creator.slug,'_blank','noopener');return}if(a==='address-save'){const v=document.getElementById('address-input')?.value||'';if(/^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$/.test(v)){state.data.creator.slug=v;state.addressInput=v;state.saved.creator.slug=v;state.saveStatus='주소를 바꿨어요. 30일 동안 다시 바꿀 수 없어요.';render()}else{state.saveStatus='영소문자·숫자·하이픈(-) 3~30자';render()}return}if(a==='retry-save'){state.demo='ready';state.saveStatus='';if(state.draft)saveForm();else render();return}if(a==='photo-clear'){state.data.creator.photo='';render();return}if(a==='image-pick'){(state.draft?document.getElementById('draft-photo-input'):document.getElementById('photo-input'))?.click();return}if(a==='image-clear'){if(state.draft){state.draft.value.thumbnail='';render()}else{state.data.creator.photo='';render()}return}if(a==='photo-pick'){document.getElementById('photo-input')?.click();return}
if(a==='feedback'){alert('의견을 보내 주셔서 고마워요.');return}if(a==='logout'){alert('로그아웃할까요?');return}if(a==='guest-more'){return}
});
document.addEventListener('input',e=>{const f=e.target.dataset.field;if(f==='draft.title'||f==='draft.url'||f==='draft.description'){state.draft.value[f.split('.')[1]]=e.target.value;const card=e.target.closest('.field');const c=card?.querySelector('.counter');if(c)c.textContent=`${e.target.value.length}/${e.target.maxLength}`;document.getElementById('preview').innerHTML=publicMarkup();document.getElementById('draft-chip').hidden=!dirty();syncDirtyBadge()}if(f==='creator.name'){state.data.creator.name=e.target.value;renderPreserve(e.target)}if(f==='creator.bio'){state.data.creator.bio=e.target.value;renderPreserve(e.target)}if(f==='address.input')state.addressInput=e.target.value;const url=e.target.dataset.socialUrl;if(url!==undefined){state.data.socials[Number(url)].url=e.target.value;document.getElementById('draft-chip').hidden=!dirty();syncDirtyBadge()}});
function syncDirtyBadge(){document.getElementById('draft-chip').hidden=!dirty();document.getElementById('mobile-draft-chip').hidden=!dirty();document.querySelectorAll('.panel-dirty').forEach(x=>x.remove());if(dirty()){const head=document.querySelector('.mobile-sheet-head h2')||document.querySelector('#inspector-content .inspector-head h1');head?.insertAdjacentHTML('afterend','<span class="badge panel-dirty">저장 안 함</span>')}const card=document.querySelector('.form-card');if(card&&state.draft){const exists=card.querySelector('.dirty-badge');const changed=JSON.stringify(state.draft.value)!==JSON.stringify(state.draft.initial);if(changed&&!exists)card.querySelector('.card-title').insertAdjacentHTML('beforeend','<span class="badge dirty-badge">저장 안 함</span>');if(!changed&&exists)exists.remove()}const first=document.querySelector('.profile-form-card');if(first){const has=first.querySelector('.dirty-badge');const changed=state.data.creator.name!==state.saved.creator.name||state.data.creator.bio!==state.saved.creator.bio||state.data.creator.photo!==state.saved.creator.photo;if(changed&&!has)first.querySelector('.card-title').insertAdjacentHTML('beforeend','<span class="badge dirty-badge">저장 안 함</span>');if(!changed&&has)has.remove()}const socials=document.querySelector('.socials-form-card');if(socials){const has=socials.querySelector('.dirty-badge');const changed=JSON.stringify(state.data.socials)!==JSON.stringify(state.saved.socials);if(changed&&!has)socials.querySelector('.card-title').insertAdjacentHTML('beforeend','<span class="badge dirty-badge">저장 안 함</span>');if(!changed&&has)has.remove()}}
document.addEventListener('change',e=>{if(e.target.dataset.socialPlatform!==undefined){state.data.socials[Number(e.target.dataset.socialPlatform)].platform=e.target.value;render()}if(e.target.id==='demo-state'){state.demo=e.target.value;if(state.demo==='dirty'){openSelection('link:yt',null);state.draft.value.description+=' (수정 중)'}document.getElementById('demo-state').value=state.demo;render()}});
function renderPreserve(el){const field=el.dataset.field,selection=[el.selectionStart,el.selectionEnd];render();const next=document.querySelector(`[data-field="${field}"]`);next?.focus();if(next?.setSelectionRange)next.setSelectionRange(...selection)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.selected&&window.matchMedia('(max-width:1023px)').matches){e.preventDefault();closeSheet()}});
document.getElementById('photo-input')?.addEventListener('change',e=>{const file=e.target.files?.[0];if(file){state.data.creator.photo=URL.createObjectURL(file);render()}});document.addEventListener('change',e=>{if(e.target.id==='draft-photo-input'&&e.target.files?.[0]){state.draft.value.thumbnail=URL.createObjectURL(e.target.files[0]);render()}});
render();
</script>
</body>
