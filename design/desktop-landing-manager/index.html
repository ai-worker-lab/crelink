<div class="shell"><aside class="side"><nav class="menu" aria-label="관리 메뉴"></nav></aside><main class="panel" id="panel"></main><aside class="preview-col"><div class="preview-title"><h2>미리보기</h2><p>방문자에게 보이는 모습이에요. 숨긴 링크·차단된 링크는 빠져요.</p><span id="draft-badge" class="badge" hidden>저장하지 않은 변경 포함</span></div><div class="phone"><div class="phone-inner" id="preview"></div></div></aside></div>
<button class="btn preview-button" id="open-preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>미리보기</button>
<dialog class="mobile-preview" id="preview-dialog"><div class="mobile-preview-head"><h2>미리보기</h2><button class="btn small" id="close-preview">닫기</button></div><div class="phone"><div class="phone-inner" id="mobile-preview-content"></div></div></dialog>
<div class="float-demo"><details><summary>시안 상태</summary><label for="demo-state" class="sr-only">시안 상태(제품 화면 아님)</label><select id="demo-state" aria-label="시안 상태 전환(제품 화면 아님)"><option value="ready">데이터 있음</option><option value="empty">빈 랜딩</option><option value="limit">링크 한도 도달</option><option value="save-fail">저장 실패</option><option value="cooldown">주소 30일 제한</option><option value="guest-off">방명록 꺼짐</option><option value="loading">로딩</option></select></details></div>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<script>
const icon = {
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20h4L19 9a2 2 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>',
  guest: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v12H9l-5 3V5Z"/><path d="M8 9h8M8 13h5"/></svg>',
  address: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M10 8h4M12 8v9m-3 0h6"/></svg>'
};
const starter = {
  creator:{name:'하루필름',bio:'브이로그와 여행 숏폼을 만들어요. 협업 문의는 이메일로 주세요.',slug:'harufilm',email:'haru.film@gmail.com'},
  socials:[{platform:'인스타그램',url:'https://instagram.com/harufilm'},{platform:'유튜브',url:'https://youtube.com/@harufilm'}],
  links:[
    {id:'yt',title:'유튜브 최신 브이로그',url:'https://youtube.com/@harufilm',description:'도쿄 3박 4일 여행 브이로그',hidden:false,blocked:false,thumbnail:''},
    {id:'form',title:'협업 문의 폼',url:'https://forms.gle/harufilm',description:'',hidden:false,blocked:false,thumbnail:''},
    {id:'shop',title:'여행 굿즈 스토어',url:'https://smartstore.naver.com/harufilm',description:'',hidden:false,blocked:false,thumbnail:''},
    {id:'event',title:'지난 이벤트 안내',url:'https://instagram.com/harufilm',description:'',hidden:true,blocked:false,thumbnail:''},
    {id:'prize',title:'무료 경품 받기',url:'https://bit.ly/harufilm',description:'',hidden:false,blocked:true,reason:'신고된 피싱 의심 주소',thumbnail:''}
  ],
  portfolio:[
    {id:'jeju',title:'제주 관광 숏폼 캠페인',url:'https://example.com/jeju',description:'2026 · 제주 관광의 장면을 담은 숏폼 캠페인'},
    {id:'cafe',title:'카페 브랜드 협업 릴스',url:'https://example.com/cafe',description:'브랜드 협업 릴스'}
  ],
  guestbook:[
    {id:'g1',name:'민지',date:'2026-10-08 09:42',text:'영상 분위기가 너무 좋아요. 다음 여행지도 기대할게요.',secret:false,hidden:false},
    {id:'g2',name:'크리링 회원',date:'2026-10-07 18:16',text:'도쿄 브이로그 덕분에 여행 계획 잘 세웠어요.',secret:false,hidden:false},
    {id:'g3',name:'도윤',date:'2026-10-07 12:06',text:'다음 촬영지는 어디인가요?',secret:true,hidden:false},
    {id:'g4',name:'수아',date:'2026-10-06 21:30',text:'협업 문의 남겼어요.',secret:false,hidden:true}
  ]
};
const clone = value => JSON.parse(JSON.stringify(value));
const state = {
  saved: clone(starter),
  data: clone(starter),
  section:'edit',
  guestEnabled:true,
  guestTab:'links',
  activeForm:null,
  status:{profile:'',socials:'',links:'',portfolio:'',guest:'',address:''},
  address:{input:'',checking:false,available:false,cooldown:false},
  demo:'ready',
  saveFailureNext:false,
  order:{pointerId:null,source:null,target:null,keyboardId:null},
  previewOpen:false
};
const $ = (selector, root=document) => root.querySelector(selector);
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function avatarContent(name,photo,alt='') {
 if(photo)return '<img src="'+photo+'" alt="'+esc(alt)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
 if(name)return esc(name[0]);
 return '<svg viewBox="0 0 48 48" aria-hidden="true" fill="currentColor"><circle cx="24" cy="16" r="9"/><path d="M7 43c1-10 7-16 17-16s16 6 17 16H7Z"/></svg>';
}
const slugPart = url => { try { return new URL(url).hostname; } catch { return ''; } };
const visibleLinks = () => state.data.links.filter(link => !link.hidden && !link.blocked);
const announce = message => { $('#announcement').textContent=''; requestAnimationFrame(()=>$('#announcement').textContent=message); };
function isDirty() {
  const profileDirty = state.data.creator.name !== state.saved.creator.name || state.data.creator.bio !== state.saved.creator.bio || state.data.creator.photo !== state.saved.creator.photo;
  const socialDirty = JSON.stringify(state.data.socials) !== JSON.stringify(state.saved.socials);
  return profileDirty || socialDirty || Boolean(state.activeForm?.dirty) || (state.activeForm?.type==='portfolio' && JSON.stringify(state.activeForm.draft)!==JSON.stringify(state.activeForm.initial));
}
function setState(change) {
  change(state);
  render();
}
function statusLine(text, kind='') {
  if (!text) return '';
  const retry = kind==='error' ? '<button class="btn small" data-action="retry-save">다시 시도</button>' : '';
  return '<div class="status '+kind+'" role="'+(kind==='error'?'alert':'status')+'"><span>'+esc(text)+'</span>'+retry+'</div>';
}
function formErrorLine() {
  return state.activeForm?.error
    ? '<div class="status error" role="alert"><span>'+esc(state.activeForm.error)+'</span></div>'
    : '';
}
function addressCheckLine(text, kind='') {
  return '<p class="status '+kind+' address-status" aria-live="polite">'+esc(text)+'</p>';
}
function button(label, action, kind='') {
  return '<button class="btn '+kind+'" data-action="'+action+'">'+label+'</button>';
}
function switchButton(checked, action, label) {
  return '<button class="switch" role="switch" aria-checked="'+checked+'" data-action="'+action+'" aria-label="'+esc(label)+'"><span class="switch-track"><span class="switch-knob"></span></span><span>숨김</span></button>';
}
function snsGlyph(platform) {
 const paths={
  '인스타그램':'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="18" cy="6" r="1" fill="currentColor" stroke="none"/>',
  '유튜브':'<rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/>',
  '틱톡':'<path d="M14 3v11a4 4 0 1 1-3-3.9M14 3c1 3 3 4 6 4"/>',
  'X':'<path d="M4 4l16 16M20 4 4 20"/>',
  '네이버 블로그':'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h8v8H8zM10 6v2m4-2v2"/>'
 };return '<svg class="sns-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">'+(paths[platform]||paths['X'])+'</svg>';
}
function summaryMarkup() {
  const name = state.data.creator.name;
  return '<section class="card summary" data-od-id="creator-summary"><div class="avatar">'+avatarContent(name,state.data.creator.photo,'프로필 사진')+'</div><div><strong class="summary-name '+(!name?'subtle':'')+'">'+esc(name || '이름 없음')+'</strong><div class="url-line"><span class="mono">crelink.me/'+esc(state.data.creator.slug)+'</span><button class="btn small" data-action="copy">복사</button></div></div><button class="btn small summary-change" data-action="address-go">주소 변경</button><p class="summary-help">인스타그램 프로필 편집 &gt; 링크에 이 주소를 붙여 넣으세요.</p></section>';
}
function inputField(label, key, value, max, type='text') {
  const isArea = type==='textarea';
  const control = isArea ? '<textarea class="textarea" data-field="'+key+'" maxlength="'+max+'">'+esc(value)+'</textarea>' : '<input class="input" data-field="'+key+'" maxlength="'+max+'" value="'+esc(value)+'">';
  return '<label class="field"><span>'+label+'</span>'+control+'<span class="counter">'+String(value||'').length+'/'+max+'자</span></label>';
}
function profileCard() {
  const dirty = state.data.creator.name!==state.saved.creator.name || state.data.creator.bio!==state.saved.creator.bio || state.data.creator.photo!==state.saved.creator.photo;
  const photo = '<div class="row"><span class="avatar">'+avatarContent(state.data.creator.name,state.data.creator.photo,'프로필 사진')+'</span><input id="profile-photo-file" type="file" accept="image/*" hidden><button class="btn small" data-action="photo-pick">사진 고르기</button><button class="btn small" data-action="photo-clear">지우기</button></div>';
  return '<article class="card" data-od-id="profile-card"><div class="card-head"><div><h2>프로필</h2><p>방문자가 처음 만나는 소개를 관리해요.</p></div>'+(dirty?'<span class="badge dirty-chip">저장 안 함</span>':'')+'</div><div class="fields"><div class="field"><span class="label">프로필 사진</span>'+photo+'</div>'+inputField('이름 (닉네임)','creator.name',state.data.creator.name,40)+inputField('소개','creator.bio',state.data.creator.bio,300,'textarea')+'</div><p class="hint space-top-12">모두 선택 항목이에요. 비워 두면 방문자 화면에 보이지 않고, 프로필 사진이 없으면 기본 프로필이 보여요.</p><div class="actions">'+button('프로필 저장','profile-save','primary')+'</div>'+statusLine(state.status.profile,state.status.profile.includes('연결')?'error':state.status.profile.includes('저장했')?'ok':'')+'</article>';
}
function socialsCard() {
  const rows=state.data.socials.map((item,index)=>'<div class="sn-row"><span class="sn-platform" aria-label="'+esc(item.platform)+'">'+snsGlyph(item.platform)+'</span><select data-social-platform="'+index+'" aria-label="SNS 플랫폼"><option '+(item.platform==='인스타그램'?'selected':'')+'>인스타그램</option><option '+(item.platform==='유튜브'?'selected':'')+'>유튜브</option><option '+(item.platform==='틱톡'?'selected':'')+'>틱톡</option><option '+(item.platform==='X'?'selected':'')+'>X</option><option '+(item.platform==='네이버 블로그'?'selected':'')+'>네이버 블로그</option></select><input class="input" data-social-url="'+index+'" value="'+esc(item.url)+'" aria-label="계정 주소"><button class="btn small" data-action="social-remove" data-index="'+index+'">빼기</button></div>').join('');
  const dirty=JSON.stringify(state.data.socials)!==JSON.stringify(state.saved.socials);
  return '<article class="card" data-od-id="social-card"><div class="card-head"><div><h2>SNS 채널</h2><p>최대 10개까지 추가할 수 있어요.</p></div>'+(dirty?'<span class="badge dirty-chip">저장 안 함</span>':'')+'</div>'+ (rows||'<p class="hint">아직 등록한 SNS 채널이 없어요.</p>')+'<div class="actions">'+(state.data.socials.length<10?button('SNS 채널 추가','social-add'):'' )+button('SNS 채널 저장','social-save')+'</div>'+(state.data.socials.length>=10?statusLine('SNS 채널은 최대 10개까지 넣을 수 있어요.'): '')+statusLine(state.status.socials,state.status.socials.includes('실패')?'error':state.status.socials?'ok':'')+'</article>';
}
function imageField(label, value) {
  const preview=value?'<img class="image-preview" src="'+value+'" alt="" width="56" height="56">':'<span class="image-preview" aria-hidden="true"></span>';
  return '<div class="field"><span class="label">'+label+'</span><div class="row image-field">'+preview+'<input id="form-image-file" class="sr-only" type="file" accept="image/*" data-action="image-pick"><div class="image-actions"><button class="btn small" data-action="image-choose">사진 고르기</button><button class="btn small" data-action="image-clear">지우기</button></div></div></div>';
}
function linkEditor(link,isNew) {
  const f=state.activeForm.draft;
  if(window.matchMedia('(max-width:1023px)').matches)return '';
  return '<div class="editor" data-form-id="'+esc(link.id)+'"><div class="fields">'+inputField('표시 이름','form.title',f.title,60)+
    '<label class="field"><span>주소</span><input class="input" data-field="form.url" value="'+esc(f.url)+'" placeholder="https://"><span class="hint">http:// 또는 https://로 시작하는 주소만 저장할 수 있어요.</span></label>'+inputField('설명','form.description',f.description,120,'textarea')+imageField('썸네일',f.thumbnail)+
    '</div>'+formErrorLine()+'<div class="actions">'+button('저장','link-save','primary')+button('취소','form-cancel')+(!isNew?button('삭제','link-delete','danger'):'')+'</div></div>';
}
function linkRows() {
  return state.data.links.map((link,index)=>{
    const isActive=state.activeForm?.id===link.id;
    const switching=switchButton(link.hidden,'link-toggle',"'"+link.title+"' 숨기기");
    const blockedToggle='<button class="switch" role="switch" aria-checked="false" disabled aria-label="'+esc("'"+link.title+"' 숨기기(차단된 링크는 바꿀 수 없음)")+'"><span class="switch-track"><span class="switch-knob"></span></span><span>숨김</span></button>';
    return '<div class="link-wrap" data-link-id="'+esc(link.id)+'"><div class="link-item '+(link.hidden?'is-hidden ':'')+(state.order.keyboardId===link.id?'is-dragging ':'')+(state.order.target===index?'drop-before':'')+'" data-index="'+index+'">'+
      '<button class="handle" data-action="handle" data-id="'+esc(link.id)+'" aria-label="‘'+esc(link.title)+'’ 링크 순서 바꾸기" draggable="false"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="6" cy="5" r="1.4"/><circle cx="14" cy="5" r="1.4"/><circle cx="6" cy="10" r="1.4"/><circle cx="14" cy="10" r="1.4"/><circle cx="6" cy="15" r="1.4"/><circle cx="14" cy="15" r="1.4"/></svg></button>'+
      '<span class="favicon">'+esc(slugPart(link.url)?.[0]?.toUpperCase()||'링')+'</span><div class="link-info"><div class="link-copy"><strong>'+esc(link.title)+'</strong><span class="mono">'+esc(slugPart(link.url))+'</span></div>'+(link.hidden?'<span class="badge">숨김</span>':'')+(link.blocked?'<span class="badge error">차단됨</span><span class="reason">크리링이 이 링크를 차단해 방문자에게 보이지 않아요. 사유: '+esc(link.reason||'신고된 피싱 의심 주소')+'</span>':'')+'</div>'+(link.blocked?blockedToggle:switching)+'<button class="btn small edit-link" data-action="link-edit" data-id="'+esc(link.id)+'">'+(isActive?'접기':'수정')+'</button></div>'+(isActive?linkEditor(link,state.activeForm.isNew):'')+'</div>';
  }).join('');
}
function linksCard() {
  const count=visibleLinks().length, atLimit=count>=5;
  const newLinkForm=state.activeForm?.type==='link'&&state.activeForm.isNew;
  let addAction=atLimit?'<div class="callout">보이는 링크 한도(5개)에 도달했어요. 다른 링크를 숨기거나 지우면 새 링크를 추가할 수 있어요. 한도를 늘리려면 크리링 운영자에게 문의해 주세요.</div>':button('링크 추가','link-add');
  if(!state.data.links.length&&!newLinkForm)addAction='<p class="hint">아직 추가한 링크가 없어요. 링크를 추가하면 오른쪽 미리보기에 바로 보여요.</p>'+button('링크 추가','link-add');
  if(state.data.links.length>=50)addAction='<div class="callout">숨긴 링크를 포함해 링크는 최대 50개까지 둘 수 있어요. 쓰지 않는 링크를 지운 뒤 추가해 주세요.</div>';
  if(newLinkForm&&!atLimit&&state.data.links.length<50)addAction='<div class="link-wrap new-link-wrap"><div class="new-link-title">새 링크</div>'+linkEditor(state.activeForm.draft,true)+'</div>';
  return '<article class="card" data-od-id="links-card"><div class="card-head links-card-head"><div><h2>링크</h2><p>손잡이를 끌거나 키보드로 순서를 바꿀 수 있어요. 숨긴 링크와 차단된 링크는 방문자에게 보이지 않고 한도에도 들어가지 않아요. 숨긴 링크 포함 전체 '+state.data.links.length+'/50개.</p></div><span class="badge '+(atLimit?'warn':'')+'">보이는 링크 '+count+'/5</span></div><div class="link-list">'+linkRows()+'</div><div class="dropzone">'+addAction+'</div>'+statusLine(state.status.links,state.status.links.includes('실패')||state.status.links.includes('연결')||state.status.links.includes('올바른')||state.status.links.includes('한도')?'error':state.status.links?'ok':'')+'</article>';
}
function portfolioEditor(item,isNew) {
  if(window.matchMedia('(max-width:1023px)').matches)return '';
  const f=state.activeForm.draft;
  return '<div class="editor"><div class="fields">'+inputField('제목','form.title',f.title,60)+'<label class="field"><span>링크</span><input class="input" data-field="form.url" value="'+esc(f.url)+'"></label>'+imageField('이미지',f.thumbnail)+inputField('설명','form.description',f.description,200,'textarea')+'</div>'+formErrorLine()+'<div class="actions">'+button('저장','portfolio-save','primary')+button('취소','form-cancel')+(!isNew?button('삭제','portfolio-delete','danger'):'')+'</div></div>';
}
function portfolioCard() {
  const rows=state.data.portfolio.map((item,i)=>{
    const active=state.activeForm?.id===item.id&&state.activeForm?.type==='portfolio';
    const row='<div class="portfolio-edit-row"><div class="port-thumb"></div><div><strong>'+esc(item.title)+'</strong><div class="mono">'+esc(item.url)+'</div><p class="hint">'+esc(item.description)+'</p></div><div class="portfolio-edit-actions"><button class="btn small" data-action="port-up" data-index="'+i+'" '+(i===0?'disabled':'')+'>위로</button><button class="btn small" data-action="port-down" data-index="'+i+'" '+(i===state.data.portfolio.length-1?'disabled':'')+'>아래로</button><button class="btn small" data-action="port-edit" data-id="'+esc(item.id)+'">'+(active?'접기':'수정')+'</button><button class="btn small danger" data-action="port-delete" data-id="'+esc(item.id)+'">삭제</button></div></div>';
    return '<div class="portfolio-wrap">'+row+(active?portfolioEditor(state.activeForm.draft,false):'')+'</div>';
  }).join('');
  const draft=state.activeForm?.type==='portfolio'&&state.activeForm.isNew?portfolioEditor(state.activeForm.draft,true):'';
  return '<article class="card" data-od-id="portfolio-card"><div class="card-head"><div><h2>포트폴리오</h2><p>항목은 최대 20개까지 등록할 수 있어요.</p></div></div>'+(rows||'<p class="hint">아직 등록한 포트폴리오가 없어요.</p>')+draft+(state.data.portfolio.length<20?button('포트폴리오 추가','portfolio-add'):'')+statusLine(state.status.portfolio,state.status.portfolio.includes('연결')?'error':state.status.portfolio?'ok':'')+'</article>';

}
document.addEventListener('click',event=>{
 const menu=event.target.closest('[data-menu]');
 if(menu){change(s=>{s.section=menu.dataset.menu;s.guestTab=s.section==='guest'?'guest':'links'});return}
 handleAction(event);
});
document.addEventListener('input',event=>{
 const key=event.target.dataset.field;
 if(key==='creator.name'||key==='creator.bio'){
  change(s=>{s.data.creator[key.endsWith('name')?'name':'bio']=event.target.value;s.status.profile=''});
 }
 if(key==='form.title'||key==='form.url'||key==='form.description'){renderAfterFormInput(event);return}
 if(key==='address.input'){
  const value=event.target.value;
  change(s=>{s.address.input=value;s.address.checking=true;s.address.available=false;s.address.error=''});
  clearTimeout(window.addressTimer);
  window.addressTimer=setTimeout(()=>change(s=>{
    s.address.checking=false;
    const v=value;
    if(!/^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$/.test(v)){s.address.error='영소문자·숫자·하이픈(-) 3~30자';return}
    if(['admin','login','me'].includes(v)){s.address.error='크리링이 쓰는 예약 주소라 쓸 수 없어요.';return}
    if(['taken','haru'].includes(v)){s.address.error='이미 사용 중이거나 다른 크리에이터를 위해 보관 중인 주소예요.';return}
    if(v===s.data.creator.slug){s.address.error='지금 쓰는 주소와 같아요.';return}
    s.address.available=true;
  }),400);
 }
});
document.addEventListener('change',event=>{
 if(event.target.id==='profile-photo-file'&&event.target.files?.[0]){const reader=new FileReader();reader.onload=()=>change(s=>s.data.creator.photo=reader.result);reader.readAsDataURL(event.target.files[0]);return}
 if(event.target.matches('input[type=file][data-action=\"image-pick\"]')&&event.target.files?.[0]&&state.activeForm){const reader=new FileReader();reader.onload=()=>change(s=>{s.activeForm.draft.thumbnail=reader.result;s.activeForm.dirty=true;if(s.activeForm.type==='link'){const i=s.data.links.findIndex(l=>l.id===s.activeForm.id);if(i>=0)s.data.links[i].thumbnail=reader.result}});reader.readAsDataURL(event.target.files[0]);return}
 if('socialPlatform' in event.target.dataset)change(s=>s.data.socials[Number(event.target.dataset.socialPlatform)].platform=event.target.value);
 if('socialUrl' in event.target.dataset)change(s=>s.data.socials[Number(event.target.dataset.socialUrl)].url=event.target.value);
});
document.addEventListener('click',event=>{
 const toggle=event.target.closest('[role="switch"]');if(!toggle)return;
 if(toggle.dataset.action==='guest-toggle')return;
 const row=toggle.closest('[data-link-id]');if(!row)return;
 const id=row.dataset.linkId,link=state.data.links.find(x=>x.id===id);if(!link||link.blocked)return;
 const willShow=link.hidden;
 if(willShow&&visibleLinks().length>=5){change(s=>s.status.links='보이는 링크 한도에 도달했어요. 다른 링크를 숨기거나 지운 뒤 다시 시도해 주세요.');return}
 change(s=>{const item=s.data.links.find(x=>x.id===id);item.hidden=!item.hidden;s.saved.links=clone(s.data.links);s.status.links="'"+item.title+"' 링크를 "+(item.hidden?'숨겼어요.':'다시 보이게 했어요.')});
});
document.addEventListener('input',event=>{if(event.target.matches('input[data-social-url],select[data-social-platform]'))change(s=>{s.data.socials=s.data.socials.map((item,i)=>({...item,url:$('[data-social-url="'+i+'"]')?.value??item.url,platform:$('[data-social-platform="'+i+'"]')?.value??item.platform}))})});

let pointerDrag=null;let pointerInsert=null;
document.addEventListener('pointerdown',event=>{
 const handle=event.target.closest('[data-action="handle"]');if(!handle||state.activeForm)return;
 const item=handle.closest('.link-wrap');
 pointerDrag={id:item.dataset.linkId,startY:event.clientY,pointerId:event.pointerId};
 handle.setPointerCapture(event.pointerId);
});
document.addEventListener('pointermove',event=>{
 if(!pointerDrag||event.pointerId!==pointerDrag.pointerId)return;
 const rows=[...document.querySelectorAll('.link-item')],target=rows.find(row=>{const r=row.getBoundingClientRect();return event.clientY>=r.top&&event.clientY<=r.bottom});
 if(!target)return;
 const rect=target.getBoundingClientRect(),after=event.clientY>rect.top+rect.height/2;
 pointerInsert=Number(target.dataset.index)+(after?1:0);
 rows.forEach(row=>row.classList.remove('drop-before','drop-after'));target.classList.add(after?'drop-after':'drop-before');
});
document.addEventListener('pointercancel',()=>{pointerDrag=null;pointerInsert=null;change(s=>s.order={pointerId:null,source:null,target:null,keyboardId:null})});
document.addEventListener('pointerup',event=>{
 if(!pointerDrag||event.pointerId!==pointerDrag.pointerId)return;
 const source=pointerDrag.id,target=pointerInsert;pointerDrag=null;pointerInsert=null;
 if(target!==null&&source!==state.data.links[target]?.id)moveLink(source,target);
 else change(s=>s.order={pointerId:null,source:null,target:null,keyboardId:null})
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&state.activeForm&&!$('#form-dialog')){cancelForm();return}
 const handle=event.target.closest('[data-action="handle"]');if(!handle)return;
 const id=handle.dataset.id,link=state.data.links.find(x=>x.id===id);
 if([' ','Enter','ArrowUp','ArrowDown','Escape'].includes(event.key))event.preventDefault();
 if((event.key===' '||event.key==='Enter')&&!state.order.keyboardId){change(s=>s.order.keyboardId=id);const i=state.data.links.findIndex(x=>x.id===id);announce("'"+link.title+"' 링크를 들었어요. 지금 "+(i+1)+"번째, 전체 "+state.data.links.length+"개예요.");render();$('[data-id="'+id+'"][data-action="handle"]')?.focus();return}
 if((event.key===' '||event.key==='Enter')&&state.order.keyboardId){const active=state.order.keyboardId;change(s=>s.order.keyboardId=null);moveLink(active,state.data.links.findIndex(x=>x.id===active));return}
 if(event.key==='Escape'&&state.order.keyboardId){change(s=>{s.order.keyboardId=null;s.status.links='순서 변경을 취소했어요.'});return}
 if(state.order.keyboardId===id&&(event.key==='ArrowUp'||event.key==='ArrowDown')){const i=state.data.links.findIndex(x=>x.id===id),next=Math.max(0,Math.min(state.data.links.length-1,i+(event.key==='ArrowUp'?-1:1)));if(next!==i){change(s=>{const [item]=s.data.links.splice(i,1);s.data.links.splice(next,0,item)});$('[data-id="'+id+'"][data-action="handle"]')?.focus();announce("'"+link.title+"' 링크를 들었어요. 지금 "+(next+1)+"번째, 전체 "+state.data.links.length+"개예요.")}}
});
$('#demo-state').addEventListener('change',event=>demoState(event.target.value));
$('#open-preview').addEventListener('click',()=>{change(s=>s.previewOpen=true);$('#preview-dialog').showModal();$('#close-preview').focus()});
$('#close-preview').addEventListener('click',()=>$('#preview-dialog').close());
$('#preview-dialog').addEventListener('close',()=>{$('#open-preview').focus();change(s=>s.previewOpen=false)});
function render() {
 const active=document.activeElement, field=active?.dataset?.field, socialUrl=active?.dataset?.socialUrl, socialPlatform=active?.dataset?.socialPlatform, start=active?.selectionStart, end=active?.selectionEnd;
 if(state.demo==='loading') {
  $('#panel').innerHTML='<section class="card summary"><div class="skel circle"></div><div><div class="skel" style="width:140px"></div><div class="skel" style="width:220px"></div></div></section>'+[1,2,3].map(()=>'<section class="card"><div class="skel" style="width:120px"></div><div class="skel" style="height:52px"></div><div class="skel" style="height:52px"></div></section>').join('');
  $('#preview').innerHTML='<div class="phone-skeleton"><div class="skel circle"></div><div class="skel"></div><div class="skel" style="height:54px"></div><div class="skel" style="height:54px"></div></div>';
 } else {
  renderShell(); const markup=publicMarkup();$('#preview').innerHTML=markup;$('#mobile-preview-content').innerHTML=markup;
 }
 $('#draft-badge').hidden=!isDirty();$('#open-preview').hidden=state.demo==='loading';$('.head-actions a').href='https://crelink.me/'+state.data.creator.slug;
 const focusSelector=field?'[data-field="'+field+'"]':socialUrl!==undefined?'[data-social-url="'+socialUrl+'"]':socialPlatform!==undefined?'[data-social-platform="'+socialPlatform+'"]':'';
 if(focusSelector){const next=$(focusSelector);if(next){next.focus();if(typeof start==='number'&&next.setSelectionRange)next.setSelectionRange(start,end)}}
}
document.addEventListener('DOMContentLoaded',()=>render());
</script></body></html>
