<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: P;
        src: url(../../public/Pretendard-Regular.woff2);
        font-weight: 400;
      }
      @font-face {
        font-family: P;
        src: url(../../public/Pretendard-Bold.woff2);
        font-weight: 700;
      }
      @font-face {
        font-family: P;
        src: url(../../public/Pretendard-ExtraBold.woff2);
        font-weight: 800;
      }
      html,
      body {
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #1a1c20;
        color: #fff;
        font-family: P;
        box-sizing: border-box;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        font-weight: 800;
        font-size: 40px;
        letter-spacing: -0.5px;
      }
      h1 {
        margin: 0;
        font-weight: 800;
        font-size: 76px;
        line-height: 1.18;
        letter-spacing: -2px;
      }
      .sub {
        margin-top: 24px;
        font-weight: 400;
        font-size: 32px;
        color: #c9ccd3;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .pill {
        background: #d22d27;
        border-radius: 999px;
        padding: 18px 40px;
        font-weight: 700;
        font-size: 34px;
      }
      .url {
        font-weight: 700;
        font-size: 30px;
        color: #c9ccd3;
      }
    </style>
  </head>
  <body>
    <div class="brand">크리링</div>
    <div>
      <h1>인스타그램 프로필 링크 하나로<br />나를 소개하세요.</h1>
      <div class="sub">SNS·포트폴리오·외부 링크를 한 페이지에</div>
    </div>
    <div class="foot"><span class="url">links.shaul.kr</span><span class="pill">무료로 시작하기</span></div>
  </body>
</html>
