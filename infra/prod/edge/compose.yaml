# 크리링 운영 edge 스택: 공개 정책 Caddy 하나(ADR 0011 결정 2). 배포·롤백과 무관하게 계속 떠 있고, 설정은 reload로만 바꿉니다.
# 서버에는 cutover.sh가 이 파일을 /opt/crelink/edge/compose.yaml로 복사해 그곳에서 실행합니다(릴리스 폴더 정리와 무관).
#   docker compose -f /opt/crelink/edge/compose.yaml up -d --wait     (런북 "edge")
# - 설정 폴더 /opt/crelink/edge/conf(deploy 소유)를 폴더째 읽기 전용으로 붙입니다. 파일 하나를 bind하면 mv로 바꿨을 때 컨테이너가
#   옛 inode를 계속 보므로(moby#15793) 폴더 bind입니다. 안의 Caddyfile(릴리스의 infra/prod/Caddyfile 사본)과 upstreams.caddy(활성 색)는
#   lib.sh가 원자적으로 바꾼 뒤 `docker exec <이 컨테이너> caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile`로 반영합니다.
# - 관리 API는 컨테이너 안 localhost:2019에서만 열립니다(Caddyfile admin). 호스트·네트워크에 열지 않습니다.
# - 호스트 포트는 127.0.0.1:${CRELINK_HTTP_PORT} 하나이고 같은 호스트의 cloudflared만 붙습니다.
# - 이 파일(이미지·포트·마운트)을 바꾸면 reload로는 반영되지 않아 edge를 다시 만들어야 합니다(1~2초 공백, 런북 "edge 설정 갱신").
# 저장소에서 문법 확인: docker compose -f infra/prod/edge/compose.yaml config --quiet
name: crelink-edge

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:${CRELINK_HTTP_PORT:-18080}:80
    environment:
      CRELINK_SHORT_HOST: ${CRELINK_SHORT_HOST:-go.shaul.kr}
      CRELINK_WEB_HOST: ${CRELINK_WEB_HOST:-links.shaul.kr}
    volumes:
      # CRELINK_EDGE_CONF는 시험용(lib.sh가 CRELINK_ROOT 기준으로 넘김). 서버에서는 기본값 그대로입니다.
      - ${CRELINK_EDGE_CONF:-/opt/crelink/edge/conf}:/etc/caddy:ro
    read_only: true
    tmpfs: [/data, /config]
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2020/healthz]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    networks: [edge]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

networks:
  edge:
    name: ${CRELINK_EDGE_NETWORK:-crelink-edge}
    external: true
