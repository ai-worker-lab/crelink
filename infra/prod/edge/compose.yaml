# 서버 공용 edge Caddy(80·443). 서버 /opt/edge에서 Compose project `edge`로 실행합니다. 이 서버의 공개 HTTPS 사이트를 모두 맡으며
# 사이트별 설정은 sites/*.caddy(크리링은 deploy.sh가 sites/crelink.caddy를 갱신), 사이트별 값은 /opt/edge/.env(.env.example 참고)에 둡니다.
# 저장소에서 문법 확인: docker compose -f infra/prod/edge/compose.yaml --env-file infra/prod/edge/.env.example config --quiet
# 사이트 파일을 바꾼 뒤: docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile
name: edge

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    # 사이트 파일이 쓰는 값만 넘깁니다. 값을 바꾸면 reload가 아니라 docker compose up -d(컨테이너 재생성)가 필요합니다.
    environment:
      CRELINK_DOMAIN: ${CRELINK_DOMAIN:-go.shaul.kr}
      CRELINK_INTERNAL_TOKEN: ${CRELINK_INTERNAL_TOKEN:?CRELINK_INTERNAL_TOKEN이 없습니다. /opt/edge/.env를 확인하세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 폴더로 마운트해 사이트 파일을 추가·교체한 뒤 reload만으로 반영합니다.
      - ./sites:/etc/caddy/sites:ro
      # 인증서·ACME 계정(공식 이미지 안내대로 유지해야 재발급을 피함).
      - data:/data
      - config:/config
    networks:
      - edge
      - aichat
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

networks:
  # 앱 Compose가 external로 참가하는 공용 네트워크(크리링 api는 별칭 crelink-api).
  edge:
    name: ${EDGE_NETWORK:-edge}
  # ai-character-chat 백엔드 Compose가 만든 네트워크(그 프로젝트가 소유). 업스트림 ai-character-chat-backend-api-1에 닿기 위해 참가만 합니다.
  aichat:
    external: true
    name: ${AICHAT_NETWORK:-ai-character-chat-backend_backend}

volumes:
  data:
  config:
