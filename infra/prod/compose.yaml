# 크리링 운영(prod) 앱 스택: api + web 한 벌(한 색). 공개 정책 Caddy는 edge 스택(edge/compose.yaml)에 따로 있습니다. 절차: infra/docs/prod-runbook.md
# 같은 파일을 색(blue·green)마다 다른 Compose project로 띄웁니다(Blue/Green, ADR 0011). lib.sh가 릴리스 폴더에서 다음처럼 실행합니다.
#   CRELINK_COLOR=<색> docker compose -p crelink-<색> -f compose.yaml --env-file <이미지 파일> up -d --wait
# - project 이름(name:)은 두지 않습니다. -p가 없으면 폴더 이름으로 떠 운영 색과 섞이므로 항상 lib.sh(또는 런북 명령)로 실행합니다.
# - 이미지(API_IMAGE·WEB_IMAGE)는 --env-file, 앱 설정·비밀값은 secrets/<대상>.sops.env를 lib.sh가 서버에서 복호화한
#   /run/crelink/app.env(tmpfs, 권한 600)에서 옵니다. 평문 비밀값은 저장소·이미지·CI에 없습니다.
# - 호스트에 여는 포트는 없습니다. edge Caddy가 공용 외부 네트워크(crelink-edge)에서 색 별칭(api-<색>·web-<색>)으로 부릅니다.
#   Compose는 서비스 이름(api·web)도 모든 네트워크에 별칭으로 붙여 두 색이 함께 떠 있으면 crelink-edge에서 api가 양쪽으로 풀리므로
#   Caddy·web 어디서도 색 없는 이름을 쓰지 않습니다(0035 실측, tests/zero-downtime.sh가 같은 색 호출만 일어나는지 확인).
# 저장소에서 문법 확인: CRELINK_COLOR=blue CRELINK_APP_ENV=/dev/null docker compose -f infra/prod/compose.yaml --env-file infra/prod/images.env.example config --quiet

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  api:
    image: ${API_IMAGE:?API_IMAGE가 없습니다(images.env)}
    restart: unless-stopped
    env_file:
      - path: ${CRELINK_APP_ENV:-/run/crelink/app.env}
    # PID 1이 node라 신호 전달·좀비 정리를 위해 init을 둡니다(tini가 SIGTERM을 node에 넘김).
    init: true
    # 정지: SIGTERM 뒤 진행 중 요청을 마치고 스스로 끝날 때까지 최대 30초 기다린 다음 SIGKILL(기본 10초).
    # Cloudflare 원본 응답 한도 100초(524)보다 충분히 짧습니다. 런북 "값 한눈에 보기".
    stop_grace_period: 30s
    # 헬스: test·interval·timeout·retries는 이미지 HEALTHCHECK(apps/api/Dockerfile) 것을 그대로 물려받고(docker inspect로 확인, 런북 6)
    # 기동 중(start_period 안)에만 1초마다 검사해 준비되자마자 healthy가 됩니다(Engine 25 이상). Compose는 start_interval에
    # start_period를 요구하므로 이미지와 같은 값을 다시 적습니다. Dockerfile의 --start-period를 바꾸면 여기도 바꿉니다.
    healthcheck:
      start_period: 30s
      start_interval: 1s
    environment:
      # 업로드는 S3 호환 저장소만 씁니다(app.env의 S3_*, 런북 9). 이 compose에는 uploads 볼륨이 없어 disk면 이미지가 컨테이너 안에만
      # 저장되고 다음 배포에 사라지므로 app.env 값과 관계없이 s3로 고정합니다(environment가 env_file보다 우선). disk로 되돌리기는
      # uploads 볼륨이 있는 릴리스로 롤백합니다(런북 9-4·9-5).
      FILE_STORAGE: s3
    volumes:
      - geoip:/data/geoip:ro
      # Supabase 루트 CA(공개 인증서). app.env의 DATABASE_SSL_CA_PATH가 /etc/crelink/certs/supabase-ca.crt를 가리킵니다.
      - ./certs:/etc/crelink/certs:ro
    networks:
      default: {}
      edge:
        aliases:
          - api-${CRELINK_COLOR:?CRELINK_COLOR(blue|green)가 없습니다}
    security_opt: [no-new-privileges:true]
    logging: *logging

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE가 없습니다(images.env)}
    restart: unless-stopped
    environment:
      # 웹 서버 측 호출은 같은 색의 API로 바로 갑니다(공개 Caddy를 거치지 않음, 내부 토큰 불필요). api·web이 항상 같은 릴리스 쌍입니다.
      API_INTERNAL_URL: http://api-${CRELINK_COLOR:?CRELINK_COLOR(blue|green)가 없습니다}:3000
    # 정지·헬스는 api와 같은 규칙입니다(start_period는 apps/web/Dockerfile HEALTHCHECK와 같은 값).
    init: true
    stop_grace_period: 30s
    healthcheck:
      start_period: 20s
      start_interval: 1s
    read_only: true
    tmpfs: [/tmp]
    networks:
      default: {}
      edge:
        aliases:
          - web-${CRELINK_COLOR:?CRELINK_COLOR(blue|green)가 없습니다}
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # GeoIP 파일을 geoip 볼륨에 쓰는 일회성 도구(geoip.sh가 docker compose run으로만 실행, up 대상 아님).
  geoip-writer:
    image: alpine:3.24
    profiles: [tools]
    network_mode: none
    volumes:
      - geoip:/data/geoip
    logging: *logging

# edge Caddy와 두 색이 함께 붙는 공용 네트워크. bootstrap.sh·cutover.sh가 만듭니다(CRELINK_EDGE_NETWORK는 시험용).
networks:
  edge:
    name: ${CRELINK_EDGE_NETWORK:-crelink-edge}
    external: true

# GeoIP 데이터는 blue/green 이전(crelink-prod)의 볼륨을 두 색이 같이 씁니다. bootstrap.sh·cutover.sh가 없으면 만듭니다(CRELINK_GEOIP_VOLUME은 시험용).
volumes:
  geoip:
    name: ${CRELINK_GEOIP_VOLUME:-crelink-prod_geoip}
    external: true
