# 크리링 운영(prod) 스택: caddy(공개 정책) + api + web. 모든 배포 대상이 같은 파일을 씁니다. 절차: infra/docs/prod-runbook.md
# 서버에서는 deploy.sh가 /opt/crelink/current(이 폴더의 릴리스 사본)에서 다음처럼 실행합니다.
#   docker compose -f compose.yaml --env-file /opt/crelink/state/images.env up -d --wait
# - 이미지(API_IMAGE·WEB_IMAGE)는 state/images.env, 앱 설정·비밀값은 secrets/<대상>.sops.env를 deploy.sh가 서버에서 복호화한
#   /run/crelink/app.env(tmpfs, 권한 600)에서 옵니다. 평문 비밀값은 저장소·이미지·CI에 없습니다.
# - 호스트에 여는 포트는 caddy의 127.0.0.1:${CRELINK_HTTP_PORT} 하나이고 같은 호스트의 cloudflared만 붙습니다.
# 저장소에서 문법 확인: CRELINK_APP_ENV=/dev/null docker compose -f infra/prod/compose.yaml --env-file infra/prod/images.env.example config --quiet
name: crelink-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:${CRELINK_HTTP_PORT:-18080}:80
    environment:
      CRELINK_SHORT_HOST: ${CRELINK_SHORT_HOST:-go.shaul.kr}
      CRELINK_WEB_HOST: ${CRELINK_WEB_HOST:-links.shaul.kr}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs: [/data, /config]
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2020/healthz]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *logging

  api:
    image: ${API_IMAGE:?API_IMAGE가 없습니다(state/images.env)}
    restart: unless-stopped
    env_file:
      - path: ${CRELINK_APP_ENV:-/run/crelink/app.env}
    # PID 1이 node라 신호 전달·좀비 정리를 위해 init을 둡니다(tini가 SIGTERM을 node에 넘김).
    init: true
    # 정지: SIGTERM 뒤 진행 중 요청을 마치고 스스로 끝날 때까지 최대 30초 기다린 다음 SIGKILL(기본 10초).
    # Cloudflare 원본 응답 한도 100초(524)보다 충분히 짧습니다. 런북 "값 한눈에 보기".
    stop_grace_period: 30s
    # 헬스: test·interval·timeout·retries는 이미지 HEALTHCHECK(apps/api/Dockerfile) 것을 그대로 물려받고(docker inspect로 확인, 런북 6)
    # 기동 중(start_period 안)에만 1초마다 검사해 준비되자마자 healthy가 됩니다(Engine 25 이상). Compose는 start_interval에
    # start_period를 요구하므로 이미지와 같은 값을 다시 적습니다. Dockerfile의 --start-period를 바꾸면 여기도 바꿉니다.
    healthcheck:
      start_period: 30s
      start_interval: 1s
    environment:
      # 업로드는 S3 호환 저장소만 씁니다(app.env의 S3_*, 런북 9). 이 compose에는 uploads 볼륨이 없어 disk면 이미지가 컨테이너 안에만
      # 저장되고 다음 배포에 사라지므로 app.env 값과 관계없이 s3로 고정합니다(environment가 env_file보다 우선). disk로 되돌리기는
      # uploads 볼륨이 있는 릴리스로 롤백합니다(런북 9-4·9-5).
      FILE_STORAGE: s3
    volumes:
      - geoip:/data/geoip:ro
      # Supabase 루트 CA(공개 인증서). app.env의 DATABASE_SSL_CA_PATH가 /etc/crelink/certs/supabase-ca.crt를 가리킵니다.
      - ./certs:/etc/crelink/certs:ro
    security_opt: [no-new-privileges:true]
    logging: *logging

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE가 없습니다(state/images.env)}
    restart: unless-stopped
    environment:
      # 웹 서버 측 호출은 내부 네트워크로 API에 바로 갑니다(공개 Caddy를 거치지 않음, 내부 토큰 불필요).
      API_INTERNAL_URL: http://api:3000
    # 정지·헬스는 api와 같은 규칙입니다(start_period는 apps/web/Dockerfile HEALTHCHECK와 같은 값).
    init: true
    stop_grace_period: 30s
    healthcheck:
      start_period: 20s
      start_interval: 1s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # GeoIP 파일을 geoip 볼륨에 쓰는 일회성 도구(geoip.sh가 docker compose run으로만 실행, up 대상 아님).
  geoip-writer:
    image: alpine:3.22
    profiles: [tools]
    network_mode: none
    volumes:
      - geoip:/data/geoip
    logging: *logging

volumes:
  geoip:
